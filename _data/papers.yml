      suggest: >-
        After each task, partners explain to each other how they solved it, because articulating strategies helps turn bodily activity
        into concepts (Abrahamson & Lindgren, 2014).
    - paper: cel-math-vr
      section: discussion
      page: 11
      type: experiment
      passage: >-
        learners who engage with the full-body simulation are less likely to focus on the “surface features” of the simulation experience
      suggest: >-
        Whole-body enactment seems to direct attention to the important dynamic relations rather than to surface features (Abrahamson &
