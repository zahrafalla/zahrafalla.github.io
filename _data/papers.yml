      passage: >-
        we define “embodied concreteness” as a form of concreteness that involves a high degree of embodiment, in a situated and relatable
        context.
      suggest: >-
        Following Chatain et al. (2023), we aim at embodied concreteness: a high degree of embodiment in a situated and relatable context.
    - paper: cel-math-vr
      section: design
      page: 4
      type: important
      passage: >-
        This two-handed interaction has two main advantages: it strengthens the embodiment as the capacity of the edge is directly congruent
        to the distance between the two hands, and it improves usability as the learner can release the lower hand to precisely set the
        level of the edge.
      suggest: >-
        Interactions are chosen for gestural congruency: as in the pipes of Chatain et al. (2023), where the flow equals the distance
