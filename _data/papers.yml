- id: nathan-walkington-2017
  title: "Grounded and embodied mathematical cognition: Promoting mathematical insight and proof using action and language"
  authors: Mitchell J. Nathan, Candace Walkington
  cite: Nathan & Walkington 2017
  short: "N&W"
  color: "#f0628f"
  year: 2017
  venue: Cognitive Research, Principles and Implications 2, Article 9
  doi: 10.1186/s41235-016-0040-5
  pages: 20
  read: 2026-11
  ideas: [grounded, simulation, dual, gesture, directed, design, maths, metaphor, language, collaboration]
  builds_on: [kirsh-maglio-1994, lakoff-nunez-2000, goldin-meadow-2005, lindgren-johnson-glenberg-2013, nathan-2014]
  mentions: [barsalou, kirsh, abrahamson, lindgren, nathan, walkington, lakoff, goldin-meadow, glenberg, nunez, alibali, johnson-glenberg, kahneman]
  cites: [barsalou-2008]
  summary: >-
    Presents GEMC, a theory of how actions drive mathematical thinking through "action-cognition transduction". Directed actions can
    foster insight, but valid proof needs action coordinated with language, and dynamic gestures mediate both. A pilot with the motion
    game The Hidden Village (N = 35) found that dynamic gestures strongly predicted insight and proof, and that a hint linking the
    movements to the conjecture improved proofs.
  experiments:
    - id: directed-2014
      title: Directed actions for triangles and gears
      page: 5
      own: false
      by: Nathan et al. 2014
      n: 120
      who: participants
      design: relevant versus irrelevant directed actions, with or without pedagogical prompts and hints
      conditions: [Relevant actions, Irrelevant actions, + prompts and hints]
      manipulated: [Action relevance, Pedagogical language]
      measured: [Intuition, Insight, Informal proof]
      tags: [perf, speech]
      tools: [Directed arm movements, Prompts and hints]
      result: Relevant actions improved intuition and insight; only adding language improved proofs.
    - id: hidden-village
      title: The Hidden Village
      page: 10
      own: true
      n: 35
      who: students in grades 6–11 (18 + 17)
      design: action relevance varied within subjects, then a hint revealing the relevance
      conditions: [Irrelevant actions, Relevant actions, Relevant + hint]
      manipulated: [Relevance of directed actions, Pedagogical hint]
      measured: [Depictive gestures, Dynamic gestures, Mathematical insight, Transformational proof]
      tags: [gesture, speech, perf]
      tools:
        [
          Laptop camera with skeleton tracking,
          Avatar movements to copy,
          Audio and video recording,
          Geometry pre-test,
          Mixed-effects logistic regression,
        ]
      result: Dynamic gestures predicted insight (OR 8.1) and proof (OR 11.5); the hint raised both.

  marks:
    - page: 1
      type: theory
      title: Action gives insight, language gives proof
      text: >-
        Actions alone can foster mathematical insight, but producing a valid proof needs action coordinated with language that states
        general properties.
      quote: action alone can foster insight but is insufficient for valid proof production if action is not coordinated with language systems
    - page: 3
      type: concept
      title: Directed actions and dynamic gestures
      text: >-
        Directed actions are movements learners are told to make; gestures are spontaneous. Dynamic depictive gestures show a
        mathematical object transforming through several states.
      quote: physical movements that learners are instructed to formulate by some kind of pedagogical agent
    - page: 3
      type: experiment
      title: Dynamic gestures and valid proofs
      text: >-
        Students who made dynamic depictive gestures were about four times more likely to produce a valid proof (Donovan et al., 2014).
      quote: The odds of generating valid proofs were 4.14-times greater
    - page: 4
      type: experiment
      title: Angles with the body (Kinect)
      text: >-
        In Smith, King and Hoyte's Kinect study, making angles with the arms helped only when students linked their movement to the
        standard geometric representation and moved dynamically to test ideas.
      quote: it was critical for students to connect their physical actions to the canonical geometric representation and to engage in dynamic movements in which they tested different hypotheses.
    - page: 5
      type: experiment
      title: Actions help intuition, hints help proof
      text: >-
        In Nathan et al. (2014), relevant directed actions improved intuition and insight but not proofs. Adding prompts and hints that
        linked the actions to the task is what improved proof.
    - page: 6
      type: theory
      title: Action-cognition transduction
      text: >-
        Like a motor that becomes a generator when turned by hand, the action–cognition system runs both ways: movement can induce
        cognitive states, even outside the learner's awareness.
      quote: explores the bidirectional relationship between cognition and action.
    - page: 8
      type: concept
      title: Proof-with-insight
      text: >-
        The GEMC model: directed action feeds spatial processing, pedagogical language feeds speech processing, and only when both meet,
        in dynamic gestures and transformational speech, does proof-with-insight appear.
      quote: Our central claim is that the coordination of action and language is necessary for students to perform simulated actions of the appropriate mathematical entities.
    - page: 10
      type: experiment
      title: The Hidden Village
      text: >-
        A laptop-camera game: players copy the arm movements of villagers (relevant or irrelevant to the next conjecture), then explain
        aloud whether a geometry conjecture is true. 18 + 17 middle- and high-school students took part.
    - page: 13
      type: experiment
      title: What predicted insight and proof
      text: >-
        Dynamic gestures predicted insight (OR 8.1) and valid proof (OR 11.5). Relevant actions raised static gestures but not dynamic
        ones. After the hint that the movements were relevant, dynamic gestures, insight and proof all increased.
      quote: making dynamic depictive gestures predicted both insight (odds ratio = 8.1, d = 1.2, p < 0.001) and proof (odds ratio = 11.5, d = 1.3, p < 0.001).
    - page: 15
      type: gap
      title: We do not know how to elicit dynamic gestures
      text: >-
        Copying an avatar's movements did not reliably produce dynamic gestures. Turning a directed movement into a meaningful personal
        gesture is the central design problem.
      quote: we see academic benefits when students produce dynamic gestures, but we do not yet know how best to elicit them.
    - page: 17
      type: important
      title: Timing of hints and verbal overshadowing
      text: >-
        Asking learners to reflect on movements can mislead them (verbal overshadowing), and hints given before a first attempt were far
        less effective than hints given after it.
      quote: prompts delivered before students had the opportunity to prove the conjecture were far less effective than hints delivered after one attempt at proof had already been made.
    - page: 18
      type: gap
      title: Next step, collaborative proof
      text: >-
        The authors' own next step is to bring the game into classrooms for collaborative proof production, exactly where my PhD sits.
      quote: our near-term interest is to introduce this video game to high-school geometry classrooms to support collaborative proof production
    - page: 12
      type: idea
      title: Reuse the six conjectures
      text: >-
        Use the Hidden Village conjectures (doubling a rectangle's sides, similar triangles, the central angle of a circle) as shared VR
        tasks in which partners manipulate the shapes together.
    - page: 13
      type: idea
      title: Gestures from hand tracking
      text: >-
        Use the VR hand-tracking data to detect dynamic versus static gestures automatically while partners explain, as a process measure
        that predicts insight.
    - page: 15
      type: idea
      title: The partner as the directing agent
      text: >-
        Test whether imitating a partner's dynamic gesture elicits more dynamic gestures than copying an avatar, since the partner's
        movement is already meaningful for the shared task.
    - page: 17
      type: idea
      title: Hints after the first attempt
      text: >-
        In the VR tasks, show the hint "your movement relates to the problem" only after the dyad's first explanation.
    # ---- from my Zotero: my notes and highlights ----
    - page: 2
      para: 2
      type: important
      from: highlight
      title: Students trust examples over proof
      text: Students tend to rely on checking examples and conclude that a universal statement is true because the examples work.
      quote: Students tend to be overly reliant on examples when exploring mathematical conjectures and often conclude that a universal
        statement is true on the basis of only checking examples that satisfy the statement
    - page: 3
      para: 3
      type: important
      from: highlight
      title: Stopping gestures hurts learning
      text: When gestures are prevented, performance and learning often suffer.
      quote: Conversely, when gesture production is controlled, gesture inhibition often disrupts performance and learning
    - page: 4
      para: 5
      type: concept
      from: highlight
      title: Insight is not intuition
      text: Intuition uses unconscious information to make a judgement and leaves no reportable trace; insight uses conscious retrieval
        to report on, or partly give, a solution.
      quote: Insight is related to but distinct from intuition
    - page: 5
      para: 5
      type: theory
      from: highlight
      title: System 1 and System 2
      text: "Directed actions work through automatic, nonverbal System 1; gestures, bound to language, reach the deliberate System 2. My
        notes: System 1 versus System 2 in embodied cognition. I like this paper because it works with both."
      quote: System 1 processes that are automatic, effortless, nonverbal, and largely unconscious
    - page: 6
      para: 1
      type: important
      from: highlight
      title: ACT borrows from mechanics
      text: Action-cognition transduction is inspired by how electromechanical and biological systems turn input into output, and back.
      quote: ACT theory draws inspiration from reciprocal properties of electromechanical and biological systems relating input-output behavior.
    - page: 6
      para: 5
      type: important
      from: highlight
      title: Knowledge from action can stay unaware
      text: Knowledge that comes from action may work outside the learner's awareness, without immediate words.
      quote: In this manner, actiontransduced knowledge may operate outside of the awareness of the learner.
    - page: 6
      para: 6
      type: important
      from: highlight
      title: Specific meaning through simulation
      text: Enacting, observing and recalling behaviours lets people run or re-run mental simulations; this is how actions make specific
        meaning (the GAME framework). I marked it “impo”.
      quote: specific meaning-making through mental simulation
    - page: 7
      para: 2
      type: concept
      from: highlight
      title: Transformational speech
      text: "Speech that carries a proof: (1) logical inferences from premises, (2) generalising relationships between mathematical entities,
        (3) operational thought, a chain of goals."
      quote: (1) logical inferences, where conclusions are drawn from premises; (2) generalization of relevant mathematical relationships
        between mathematical entities; (3) operational thought
    - page: 7
      para: 6
      type: gap
      from: highlight
      title: Action alone stops at System 1
      text: Why action-based interventions build automatic skill and perception (System 1) but not the abstract understanding and reflection
        that a proof needs.
      quote: This provides an account for why action-based interventions can yield proficiency in automated procedures and perceptual recognition
        (i.e., engagement of System 1) but fail to support the abstract understanding and reflection that enables verbal explanations, generalization,
        and far transfer (i.e., engagement of System 2; Evans, 2003).
    - page: 5
      para: 3
      type: idea
      from: note
      title: Is directed action enough in VR?
      text: Does this result hold in VR? Maybe in VR a directed action alone is enough, because immersion does part of the work.
    - page: 6
      para: 1
      type: people
      from: note
      title: Mitchell Nathan, through the lens of mechanics
      text: Nathan could help me look at problems in cognitive science through the lens of mechanics.
    - page: 6
      para: 1
      type: idea
      from: note
      title: Cognition through the lens of mechanics
      text: "Related to my background in mechanical engineering, and inspired by ACT: look at cognition through the lens of mechanics and
        see what happens."

