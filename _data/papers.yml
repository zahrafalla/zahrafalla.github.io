  cites: [kirsh-2013]
  summary: >-
    A handbook chapter arguing that all school subjects, even mathematics, are embodied. Three principles (learning as coordinating
    intuitive "doing" with analytic "thinking", abstraction as simulated action, and learning through equipment and its breakdowns)
    become three design challenges about activities, materials and facilitation, illustrated by the Mathematical Imagery Trainer for
    proportion and the whole-body physics game MEteor.
  experiments:
    - id: mitp
      title: Mathematical Imagery Trainer, interviews
      page: 9
      own: true
      n: 23
      who: children in grades 4–6, alone or in pairs
      design: task-based clinical interviews; symbols overlaid one by one
      conditions: [Blank screen, Cursors, Grid, Numerals, Numeric driver]
      manipulated: [Display overlays]
      measured: [Movement strategies, Spoken strategies]
      tags: [gesture, speech]
      tools: [Hand-height tracking, Screen green or red at the set ratio, Clinical interview]
      result: Children moved from "the higher, the bigger the distance" to "on the right it's double what's on the left".
      vr:
        title: The Imagery Trainer with both hands in VR
        principles:
          - Sensorimotor schemes
          - Signifying with tools
          - Language with action
        scene: Two glowing markers float in front of the learner, one in each hand. The room turns green when the right hand is twice as high as the left, and red otherwise.
        task: Make it green, then keep it green while moving up. After the first discovery, tools appear one at a time (cursors, a grid, numbers).
        conditions:
          - name: Solo
            does: one learner moves both markers
          - name: Pair
            does: two learners in the same virtual room each control one marker and have to agree aloud
          - name: Tools on request
            does: a second factor; the learner asks for the next tool instead of getting it on a schedule
        measures:
          - movement strategy from the hand paths (constant gap or growing gap)
          - coded think-aloud strategies and, for pairs, the dialogue
          - time to the first sustained green
          - proportion transfer test on paper
        why: Abrahamson shows that proportion starts as a way of moving ("the higher, the bigger the gap") and only later gets mathematical tools. Pairs have to put that scheme into words, which links the trainer to Nathan and Walkington's point that action plus language works best.
        watch: Tired arms; keep sessions short or let people sit; scale the ratio to arm length.
    - id: mitp-control
      title: Mathematical Imagery Trainer, controlled study
      page: 9
      own: false
      by: Petrick & Martin 2011
      n: 128
      who: students
      design: MIT-P activities (direct or vicarious) versus a control group
      conditions: [MIT-P, Control]
      manipulated: [Embodied activity]
      measured: [Conceptual items]
      tags: [perf]
      tools: [Mathematical Imagery Trainer]
      result: Students who did the MIT-P activities outperformed the control group on conceptual items.
      vr:
        title: Whole arms, fingers or watching
        principles:
          - Degree of embodiment
          - Vicarious learning
        scene: The same task as the Imagery Trainer, at three scales.
        task: Discover and explain the 1:2 rule in one of three versions, then take a test now and two weeks later.
        conditions:
          - name: VR arms
            does: whole-arm movements with tracked hands
          - name: Tablet fingers
            does: two fingers on a tablet, small movements
          - name: Watching
            does: watch a recording of someone else's hands with no movement (vicarious, like the original study)
        measures:
          - conceptual and procedural proportion items, before, after and delayed
          - gestures while explaining in a short interview
        why: This asks whether the size of the movement matters, from the whole body to the fingers to none at all, a question about the degree of embodiment that the original study could not separate.
        watch: Equal time on task; VR novelty fades, so the delayed test matters most.
    - id: meteor
      title: MEteor, whole body versus desktop
      page: 11
      own: true
      n: ~
      who: middle-school students
      design: the same simulation played with the whole body or on a desktop
      conditions: [Full body, Desktop]
      manipulated: [Whole-body enactment]
      measured: [Attention to surface features, Post-simulation diagrams, Predicting a successful launch]
      tags: [perf, speech]
      tools: [Room-sized floor projection, Tracking of the learner's movement, Visual and audio cues, Graph replay on a wall]
      result: Full-body learners focused less on surface features and better predicted successful launches.
      vr:
        title: MEteor at room scale
        principles:
          - Whole-body learning
          - Attention to structure
          - Prediction
        scene: Space projected around the learner in a large tracked room. Planets sit on the floor; the learner is the meteor.
        task: Predict the meteor's path near the planets by walking it, then launch it and compare.
        conditions:
          - name: Walking
            does: walk the path at room scale; speed and curves are felt in the body
          - name: Seated pointer
            does: draw the path with a controller while sitting
          - name: Desktop
            does: draw it with a mouse on a screen
        measures:
          - error between predicted and real paths
          - gaze on surface features (colours, planet looks) against forces and directions (eye tracking)
          - physics concept test and presence
        why: Lindgren found that whole-body learners attended less to surface features. Eye tracking turns "surface or structure" into a number, and walking makes acceleration something you feel as your own speed.
        watch: Room size and safety; real walking causes less sickness than joystick movement, so do not replace it with a joystick.

  marks:
    - page: 1
      type: theory
      title: Even mathematics is embodied
      text: >-
        The chapter rejects the view of mathematics as disembodied symbol manipulation. STEM knowledge is grounded in the situated,
        spatial–dynamical and bodily experience of the person doing the mathematics.
      quote: we argue that the body has everything to do with learning, even learning of abstract concepts.
    - page: 2
      type: theory
      title: Two systems, doing and thinking
      text: >-
        Immersive action runs on a fast, intuitive system; reflecting on it uses a slower, analytic one. Teaching means guiding learners
        from one to the other without losing the tacit sense of meaning.
      quote: educators seek to guide learners from immersive action to structured reflection.
    - page: 3
      type: experiment
      title: Moving symbols across the equal sign
      text: >-
        Landy's experiments show that "manipulating symbols" is not just a figure of speech. People literally move the symbols in their
        mind's eye, and arrive later when the symbol has to move against a visual current.
      quote: in our “mind’s eye” we literally move those symbols across the equal sign
    - page: 4
      type: theory
      title: Abstraction as simulated action
      text: >-
        Thinking is covert, truncated action. Concepts start as physical interaction and are internalised as simulated actions, which is
        why gestures and finger movements keep supporting mental calculation.
      quote: conceptual reasoning originates in physical interaction and becomes internalized as simulated actions.
    - page: 5
      type: concept
      title: Equipment and breakdowns
      text: >-
        As we learn to act through an artifact, the artifact shapes how we perceive and think. When it fails us, its hidden structure
        becomes visible, and that is when we learn.
      quote: When these somatic, manipulatable, or cognitive artifacts fail to deliver desired effects, we consciously reflect on, recalibrate, or modify our modes of engaging the world. That is, we learn.
    - page: 6
      type: framework
      title: Design rules for activities and materials
      text: >-
        Start with simple bodily tasks and little or no symbolism; couple every movement to the environment through action–feedback
        loops; and introduce breakdowns gradually so that new motor schemes are needed. A ready-made checklist for a VR environment.
      quote: Breakdowns of the action-environment couplings should be gradually introduced
    - page: 7
      type: important
      title: Facilitation, cueing and articulating
      text: >-
        Useful movements do not always happen naturally: learners need cueing, feedback and a guide who aligns them with expert ways of
        seeing. Asking learners to put their strategies into words is what turns action into concepts.
      quote: Embodied designs will more effectively lead to conceptual development if students are asked to articulate their strategies for interacting with materials in the environment.
    - page: 8
      type: experiment
      title: The Mathematical Imagery Trainer
      text: >-
        Students raise and lower both hands; the screen is green only when the hand heights are in a set ratio such as 1:2. Keeping it
        green while moving makes them discover proportion before any number appears ("dynamical conservation").
      quote: If the ratio is correct, the screen is green, and otherwise it is red.
    - page: 9
      type: experiment
      title: From "higher–bigger" to "double"
      text: >-
        23 children, alone or in pairs, first said "the higher I go, the bigger the distance". Adding a grid and then numerals shifted
        their strategy into mathematics. In a controlled study with 128 students, MIT-P learners beat a control group on conceptual items.
      quote: On the right its double what’s on the left
    - page: 10
      type: experiment
      title: MEteor, a whole-body physics game
      text: >-
        In a room-sized mixed-reality simulation, students walk the path of an asteroid near planets, guided by visual and audio cues, and
        then review their path on a graph on the wall.
    - page: 11
      type: experiment
      title: Whole body beats desktop
      text: >-
        Learners who enacted the physics with their whole body focused less on surface features and drew more arrows and motion in their
        diagrams than learners using a desktop version of the same simulation.
      quote: learners who engage with the full-body simulation are less likely to focus on the “surface features” of the simulation experience
    - page: 12
      type: important
      title: Learning is moving in new ways
      text: >-
        Embodied designers design the action schemes that underlie reasoning in a discipline, and teachers guiding learners' bodies are
        essential to it.
      quote: In more than one sense, learning is moving in new ways.
    - page: 6
      type: idea
      title: Designed breakdowns in VR
      text: >-
        Change a tool or frame of reference halfway through a VR geometry task (for example, the handles of a shape suddenly scale it
        instead of moving it) and log how the dyad recalibrates together.
    - page: 7
      type: idea
      title: Partners as the facilitators
      text: >-
        Replace the teacher's request to articulate strategies with peer explanation: after each task, partners explain to each other how
        they kept the property constant.
    - page: 8
      type: idea
      title: A two-person Imagery Trainer
      text: >-
        Give each partner one "hand" of a shared VR object and make it light up only while a geometric property (a ratio, an angle, an
        area) stays constant, so that the invariant has to be found together.
    - page: 9
      type: idea
      title: Fade the mathematics in
      text: >-
        Copy the MIT-P sequence in VR: blank space first, then markers, a grid and finally numbers, added only once the dyad has a bodily
        strategy.
    # ---- famous people named in the paper (2026-11-24) ----
    - page: 2
      para: 3
      type: people
      title: "John Dewey: from experience to reflection"
      text: Philosopher and educational reformer (1859–1952), father of experiential education. Abrahamson and Lindgren quote him on how reflection turns 'events into objects' with meaning, the move that embodied design wants from action to structured reflection.
    - page: 2
      para: 4
      type: people
      title: "Michael Polanyi: tacit knowledge"
      text: "Chemist and philosopher (1891–1976) who named tacit knowledge, 'we know more than we can tell'. The paper uses his blind person's stick: a new tool is first felt in the hand, later it becomes transparent and we feel the world at its tip."
    - page: 2
      para: 4
      type: people
      title: "Jean Piaget and Lev Vygotsky: action before the word"
      text: "The two founders of developmental psychology. Piaget (1896–1980) rooted logic in coordinated actions; Vygotsky (1896–1934) showed how cultural tools and signs shape thinking. The paper cites both for its dual-system idea and quotes Vygotsky: 'The word was not the beginning, action was there first'."
    - page: 1
      para: 5
      type: people
      title: "Andrea diSessa: knowledge in pieces"
      text: "Learning scientist (UC Berkeley) who showed that intuitive physics is 'knowledge in pieces', small loosely organised ideas from everyday experience. The paper uses it for MEteor: students fall back on these pieces when they reason about motion."
    - page: 3
      para: 5
      type: people
      title: "Esther Thelen: development as a dynamic system"
      text: Developmental psychologist (1941–2004) who, with Linda Smith, explained how children learn to move and think as self-organising dynamics of body and environment. Listed among those who rethink cognition as agent–environment dynamics.
    - page: 5
      para: 6
      type: people
      title: "Montessori and Papert: learning with designed objects"
      text: Maria Montessori (1870–1952) gave children materials to learn mathematics with their hands; Seymour Papert (1928–2016) built Logo so that children think by programming a turtle. The paper places them at the roots of embodied design.
