    - page: 5
      para: 3
      type: idea
      from: note
      title: Is directed action enough in VR?
      text: Does this result hold in VR? Maybe in VR a directed action alone is enough, because immersion does part of the work.
    - page: 6
      para: 1
      type: people
      from: note
      title: Mitchell Nathan, through the lens of mechanics
      text: Nathan could help me look at problems in cognitive science through the lens of mechanics.
    - page: 6
      para: 1
      type: idea
      from: note
      title: Cognition through the lens of mechanics
      text: "Related to my background in mechanical engineering, and inspired by ACT: look at cognition through the lens of mechanics and
        see what happens."

    # ---- from my Zotero, second reading (2026-11-24) ----
    - page: 10
      para: 4
      type: concept
      from: highlight
      title: What makes a proof transformational
      text: Following Harel & Sowder, a transformational proof is general (true for a whole class of objects), uses operational thought
        (a goal structure, anticipating the results of transformations), and draws conclusions by logical inference from valid premises.
      quote: Second, they involve operational thought, so that the prover progresses through a goal structure, anticipating the results
        of transformations.
    - page: 13
      para: 5
      type: idea
      from: note
      title: Dynamic movements, not just a gesture, in my VR design
      text: "Useful for my VR design: ask learners for dynamic movements that transform an object, not just a static gesture."
    - page: 13
      para: 6
      type: important
      from: highlight
      title: Action plus language helped most
      text: Once a hint linked the in-game movements to the conjecture, players made more dynamic gestures and produced more insights and
        more valid proofs.
      quote: language connecting the directed actions to the conjecture was highly beneficial for players’ mathematics performance, both
        for insight and for proof production.
    - page: 15
      para: 3
      type: important
      from: highlight
      title: Irrelevant actions, more dynamic gestures
      text: "A surprise: relevant movements made students gesture more, but mostly static gestures; irrelevant movements gave a higher share
        of dynamic ones. Repeating the relevant movement five times may have tired the motor system."
      quote: irrelevant action cues were actually more efficient at eliciting dynamic gestures than were taskrelevant cues,
    - page: 15
      para: 5
      type: important
      from: highlight
      title: A movement can lead to an unhelpful insight
      text: "One student copied the growing-angle movement but held on to 'angles add up to 180°' and argued the wrong way: a strong old
        association can take over what the movement suggests."
      quote: example of an unhelpful insight
    - page: 16
      para: 4
      type: important
      from: highlight
      title: Not thoughtless movement
      text: "The take-away: embodied mathematics is not about moving for its own sake, but about joining nonverbal and verbal forms of thinking."
      quote: GEMC is not about thoughtless movement. Rather GEMC considers the integration of nonverbal and verbal forms of (mathematical)
        thinking.
    - page: 17
      para: 1
      type: framework
      from: highlight
      title: Two design principles
      text: (1) Elicit dynamic gestures through directed actions that are congruent with the geometric relations of the task; (2) activate
        language that is explicitly coordinated with those actions, through pedagogical cues.
      quote: (1) eliciting dynamic depictive gestures through relevant directed actions that are congruent with the geometric relations
        that are present in the conjecture tasks; and (2) activating language systems that are explicitly coordinated with the relevant
        action systems, through pedagogical cues.
    - page: 17
      para: 2
      type: gap
      from: highlight
      title: Copying an avatar did not work
      text: Asking players to copy the movements of in-game characters did not reliably produce dynamic gestures; which actions to direct
        remains the open design problem. Directly relevant for avatars in VR.
      quote: However, we were not successful at effectively eliciting dynamic gestures on demand through elicitation of relevant directed
        actions by copying the motions of in-game characters
    - page: 17
      para: 3
      type: idea
      from: note
      title: Cue timing, for our study
      text: "My note on the timing of verbal cues (better after a first attempt at proof): interesting for our work."
    - page: 17
      para: 4
      type: important
      from: highlight
      title: Theory is not design
      text: "Learning theories under-constrain design: F = ma explains why a bridge stands but does not design it. Good learning environments
        come from iterative, engineering-style design. Close to my mechanics background."
      quote: Newton’s second law (F = ma) can help analyze why a bridge stands or falls, but does little to inform bridge design.
    - page: 16
      type: idea
      from: note
      title: Embodied learning and System 1, for my first paper
      text: "My summary: dynamic gestures, and dynamic gestures together with verbal cues, help students prove a geometry conjecture and
        gain insight into it; the timing of verbal cues matters (better after one attempt). I can work on this for my first paper: embodied
        learning and its relation to System 1."
      original: "that was about how gestures , dynamic gestures and context related language and verbal cues can help students to proof
        one conjucture in mathematics )geometrics) and also have insight about that and can formally and informally articulate the conjucture
        . the dynamic gestures help, an laos the combinamtion of dynamic gestures and verbal cue help alot. - timing of verbal cue are important
        ( better after one attempt) -alsooooo it suggests that gestures can related to our system 1 of thinking and teh dynamic actions
        are related to system 2 of our thinking. i can work on these type of thigs for my first paper: embodied learning and its relation
        to system 1"
    # ---- famous people named in the paper (2026-11-24) ----
    - page: 2
      para: 5
      type: people
      title: "Guershon Harel and Larry Sowder: proof schemes"
      text: Mathematics educators whose proof schemes describe what convinces students. Nathan and Walkington take from them the definition of proving, 'to remove or create doubts', and of a transformational proof.
    - page: 3
      para: 3
      type: people
      title: "Susan Goldin-Meadow: gesture helps thinking"
      text: Psychologist (University of Chicago) who showed that gestures reveal knowledge not yet in words, and that gesturing helps children learn mathematics. The paper's first finding, that gesture production predicts learning, rests on her work.
    - page: 3
      para: 1
      type: people
      title: "Martha Alibali: gesture as simulated action"
      text: Cognitive psychologist (Wisconsin) and Nathan's long-time collaborator; with Autumn Hostetter she proposed that gestures come from simulated actions. The paper uses her work on gesture inhibition and on gestures as traces of simulation.
    - page: 3
      para: 5
      type: people
      title: "David McNeill: hand and mind"
      text: "Psycholinguist (University of Chicago) who founded modern gesture studies: gesture and speech form one system of thought (Hand and Mind, 1992). The paper takes the term 'depictive gesture' from him."
    - page: 5
      para: 6
      type: people
      title: "Daniel Kahneman: System 1 and System 2"
      text: Nobel-prize psychologist (1934–2024) who split thinking into fast intuition (System 1) and slow deliberation (System 2). Nathan and Walkington link directed actions to System 1 insight and language to System 2 proof, the link I want for my first paper.
    - page: 6
      para: 6
      type: people
      title: "Daniel Wolpert: models of movement"
      text: Neuroscientist whose MOSAIC model (with Kawato) explains how the brain predicts and controls movement. The paper's GAME framework, how gestures make meaning through simulation, is built on it.
  uses:
    - paper: embodied-learning
      section: background
      page: 8
      type: theory
      passage: >-
        Our central claim is that the coordination of action and language is necessary for students to perform simulated actions of the
        appropriate mathematical entities.
      suggest: >-
        Action alone may foster insight, but valid mathematical reasoning seems to need action coordinated with language (Nathan &
        Walkington, 2017). Bodily practice should therefore be paired with chances to put it into words.
    - paper: embodied-learning
      section: method
      page: 11
      type: experiment
      passage: whether they made any spontaneous dynamic depictive gestures while attempting their proof
      suggest: >-
        Explanations are video-coded for depictive and dynamic depictive gestures, following the scheme of Nathan and Walkington (2017).
    - paper: embodied-learning
      section: results
      page: 13
      type: experiment
      passage: >-
        making dynamic depictive gestures predicted both insight (odds ratio = 8.1, d = 1.2, p < 0.001) and proof (odds ratio = 11.5,
        d = 1.3, p < 0.001).
      suggest: >-
        H4: Learners who make dynamic gestures while explaining will be more likely to reach the key insight, as dynamic gestures
        predicted both insight and valid proof in Nathan and Walkington (2017).
    - paper: cel-math-vr
      section: intro
      page: 18
      type: important
      passage: >-
        our near-term interest is to introduce this video game to high-school geometry classrooms to support collaborative proof
        production
      suggest: >-
        Embodied game environments for geometry have mostly been studied with individual learners. Nathan and Walkington (2017) name
        collaborative proof production as the next step, and it is the focus of this paper.
    - paper: cel-math-vr
      section: related
      page: 4
      type: experiment
      passage: >-
        it was critical for students to connect their physical actions to the canonical geometric representation and to engage in dynamic
        movements in which they tested different hypotheses.
      suggest: >-
        Motion-tracked geometry activities help when learners link their movements to the standard representation and move dynamically to
        test ideas (Smith et al., 2014, discussed in Nathan & Walkington, 2017).
    - paper: cel-math-vr
      section: design
      page: 17
      type: important
      passage: >-
        prompts delivered before students had the opportunity to prove the conjecture were far less effective than hints delivered after
        one attempt at proof had already been made.
      suggest: >-
        Hints that link the dyad's movements to the mathematics appear only after a first explanation attempt, since earlier prompts were
        far less effective (Nathan & Walkington, 2017).
    - paper: cel-math-vr
      section: discussion
      page: 15
      type: important
      passage: we see academic benefits when students produce dynamic gestures, but we do not yet know how best to elicit them.
      suggest: >-
        How to elicit dynamic gestures is still an open question (Nathan & Walkington, 2017). A partner's movements may be a more natural
        trigger than an avatar's instructions.

    # =============================================================================
    - paper: cel-math-vr
      section: design
      page: 17
      type: framework
      passage: >-
        (1) eliciting dynamic depictive gestures through relevant directed actions that are congruent with the geometric relations that
        are present in the conjecture tasks; and (2) activating language systems that are explicitly coordinated with the relevant action
        systems, through pedagogical cues.
      suggest: >-
        Two principles guide the design (Nathan & Walkington, 2017): the movements learners are asked to make are congruent with the
        mathematical relation, and language cues explicitly connect those movements to the mathematics.
    - paper: embodied-learning
      section: conclusion
      page: 16
      type: important
      passage: >-
        One important take-away is that GEMC is not about thoughtless movement. Rather GEMC considers the integration of nonverbal and
        verbal forms of (mathematical) thinking.
      suggest: >-
        Embodied learning is not about moving for its own sake: what matters is how bodily, nonverbal knowing is joined with verbal,
        explicit thinking (Nathan & Walkington, 2017).

- id: barsalou-2008
  title: Grounded Cognition
  authors: Lawrence W. Barsalou
  cite: Barsalou 2008
  short: "BAR"
