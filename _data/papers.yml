# -----------------------------------------------------------------------------
# Papers I've read — each one becomes a grid in the Library (/phd/): a column per page,
# a cell per paragraph, coloured by what I marked there.
#
# id       short unique slug, used in the link: /phd/#<id>
# pages    number of pages: one column of the grid per page
# paras_per_page (optional) paragraphs on a page, default 6: one cell per paragraph
# first_page (optional) printed number of the first page
# cite     short citation shown on clipped passages, e.g. Kirsh 2013
# short    2–3 letter code shown on the paper's tiles in the collage
# color    the paper's colour in the collage (pick one not used yet)
# category   its category in the Library (a key from _data/categories.yml); `also: [keys]`
#            puts it under more categories, but one is better
# ideas      shared ideas this paper uses (ids from concepts in _data/overview.yml)
# builds_on  older works it cites (ids from roots in _data/overview.yml)
# mentions   people it mentions (ids from people in _data/overview.yml)
# cites      papers I've read that it cites (ids from this file)
# experiments  the studies in this paper, shown under its grid (see below)
# marks    one entry per coloured cell of the grid
#   page   page within the paper (1 = its first page); the bar shows the printed
#          number when the paper sets first_page (e.g. 617 for a journal article)
#   para   (optional) which paragraph of that page, 1 = the first; without it the
#          marks on a page are spread down its column
#   type   one of the 8 kinds in _data/mark_types.yml:
#            theory      a theory or model the paper uses or argues for
#            framework   a new framework the paper puts forward
#            concept     a new concept or term it introduces
#            experiment  a study, its method or its results
#            people      a person whose work this paragraph is about
#            important   something that matters for my PhD
#            idea        an idea to build, inspired by this paragraph
#            gap         a gap: something not known or not done yet
#   title  a short heading
#   text   what it says, or my note
#   quote  (optional) a short verbatim quote from that page
#   from   (optional) note | highlight: the mark comes from my own Zotero notes or highlights
#          (shown with a "My note" / "My highlight" tag; notes get a white corner in the grid)
#   original (optional) my note in its original language, when `text` is a translation
# experiments
#   id, title, page, own (true = the paper's own study; false = cited, with `by`),
#   n, who, design, conditions, manipulated, measured,
#   tags (what it measures: keys from _data/measures.yml), tools, result
# uses     passages for the papers I will write (see _data/my_papers.yml);
#          they appear in the Paper collage and under this paper's bar
#   paper    id of my paper (embodied-learning | cel-math-vr)
#   section  key of the section in that paper
#   page     page of the passage
#   type     kind of mark, for the colour (theory | experiment | important | idea)
#   passage  the verbatim passage from this paper
#   suggest  a suggested text for my paper (a draft: rewrite it in my words)
#
# Add a new paper by copying a whole block (starting with "- id:").
# -----------------------------------------------------------------------------

- id: kirsh-2013
  title: Embodied Cognition and the Magical Future of Interaction Design
  authors: David Kirsh
  cite: Kirsh 2013
  short: "KIR"
  color: "#5b7cfa"
  year: 2013
  venue: ACM Transactions on Computer-Human Interaction 20(1), Article 3
  doi: 10.1145/2442106.2442109
  pages: 30
  read: 2026-11
  category: grounded
  ideas: [simulation, body-schema, enactive, marking, gesture, design, maths, mirror]
  builds_on:
    [mcluhan-1964, gibson-1966, varela-1991, kirsh-maglio-1994, iriki-1996, clark-1997, barsalou-1999, rizzolatti-craighero-2004, goldin-meadow-2005]
  mentions: [barsalou, kirsh, goldin-meadow, clark, rizzolatti, gibson, varela, iriki, noe, jeannerod, prinz, fodor]
  # how often each person is cited in the paper's text (references left out)
  cite_counts:
    { kirsh: 18, gibson: 10, iriki: 7, noe: 5, jeannerod: 4, barsalou: 3, goldin-meadow: 2, clark: 2, prinz: 2, rizzolatti: 1, varela: 1, fodor: 1 }
  cites: [barsalou-2008]
  summary: >-
    Kirsh argues that embodied cognition gives interaction designers new principles. Tools are absorbed into the body schema and
    reshape perception; we think with our bodies; doing teaches more than watching; and we can literally think with things. A study
    with expert dancers shows that "marking" (practising a simplified version of a movement) can beat full-out practice.
  experiments:
    - id: marking
      title: Marking a dance phrase
      page: 15
      own: true
      n: 10
      who: expert dancers (Random Dance)
      design: 3 practice methods × 3 phrases, Latin square, within subjects
      conditions: [Full-out, Marking, Mental simulation]
      manipulated: [Practice method]
      measured: [Technicality, Memory, Timing, Dynamics]
      tags: [perf, learn, rating]
      tools: [Video recording, Teacher + two expert coders, ANOVA + Tukey HSD]
      result: Marking gave the most learning on memory, technicality and timing; mental simulation gave almost none.
      vr:
        title: Marking a movement phrase in VR
        principles:
          - Body as a scaffold for thought
          - Partial action
          - Motor learning
        scene: An empty studio with a mirror wall. A teacher avatar performs a new 30-second movement phrase in 3D. The learner wears a headset with hand and body trackers, and every joint is recorded.
        task: Watch the phrase twice, practise it five times in one of three ways, then perform it full-out once now and once the next day.
        conditions:
          - name: Full-out
            does: practise the whole phrase at full size and speed
          - name: Marking
            does: practise with small, partial movements (the hand sketches the arm, a nod stands for a jump); the teacher avatar first shows how to mark
          - name: Mental
            does: stand still and imagine the phrase while a bar shows its length
          - name: Mirror on / off
            does: a second factor; the learner's own avatar is visible in the mirror or not
        measures:
          - accuracy of the final performance against the teacher (joint-by-joint distance after time alignment)
          - timing error and recall after 24 hours
          - how much of the movement a mark keeps (path length during practice)
          - effort (NASA-TLX, heart rate)
        why: Kirsh argues that marking works because a partial movement anchors a mental projection of the full one while saving effort. VR records every joint, so for the first time we can measure how much of the movement a mark keeps and link that amount to learning, which video coding could not do.
        watch: Use a phrase nobody knows; keep practice time equal; trackers lose fast turns; keep the play area safe.
    - id: tictactoe
      title: Tic-tac-toe in the head
      page: 19
      own: true
      n: 24
      who: participants
      design: projection versus imagination, on 3×3 and 4×4 boards
      conditions: [Blank grid, Blank page]
      manipulated: [External structure, Board size]
      measured: [Time per move, Visualisation ability]
      tags: [rt, perf, imagery]
      tools: [Blank tic-tac-toe grid, Moves called out by number, VVIQ II questionnaire]
      result: On 4×4 boards the grid saved 1.6 s per move; weak visualisers gained the most.
      vr:
        title: Projecting onto a VR board
        principles:
          - Projection
          - Offloading working memory
          - Eye movements as a trace of imagery
        scene: The player sits at a table in a quiet virtual room. A voice reads out the moves of a tic-tac-toe game that the player has to keep in mind.
        task: Play blind 4×4 games, answering each move by saying a cell. The headset tracks where the eyes go.
        conditions:
          - name: Empty grid
            does: a grid lies on the table with no pieces, structure to project onto
          - name: Blank table
            does: nothing to project onto
          - name: 3D lattice
            does: a 3×3×3 board floating in the air, a harder game where structure may help even more
          - name: Fading grid
            does: the grid fades out over the trials; does the projection survive without it?
        measures:
          - time per move and errors
          - fixations on empty cells where an imagined piece sits
          - imagery vividness questionnaire (VVIQ) as a moderator
        why: Kirsh's projection idea says that external structure lets people pin mental images to the world and so frees working memory. Eye tracking in the headset gives direct evidence of this pinning, because the eyes visit the cell where an imagined piece is.
        watch: Speech answers need speech recognition or an experimenter; counterbalance board size and condition order.
    - id: rake
      title: The rake and the body schema
      page: 7
      own: false
      by: Iriki et al. 1996
      n: ~
      who: macaque monkeys
      design: three weeks of training to pull in food with a rake
      conditions: [Before training, After training]
      manipulated: [Tool training]
      measured: [Firing of hand and arm neurons]
      tags: [brain]
      tools: [Rake, Single-neuron recording]
      result: After training, neurons coding the hand and its surrounding space included the rake.
      vr:
        title: A virtual rake and the body schema
        principles:
          - Peripersonal space
          - Tool embodiment
          - Agency
        scene: The participant sees tracked virtual hands and holds a virtual rake that reaches far across a table.
        task: Fifteen minutes of raking virtual fruit into a basket. Before and after, a short test where the controller vibrates while a light flashes near the hand or near the rake tip, and the participant says where the vibration was.
        conditions:
          - name: Active use
            does: the participant controls the rake
          - name: Passive
            does: the participant holds the rake while it moves by itself
          - name: Delayed
            does: the rake follows the hand 300 ms late
        measures:
          - crossmodal congruency effect at the rake tip (bigger after training means the rake joined the space around the body)
          - reach estimates without the rake
          - ownership and agency questionnaire
        why: Iriki's monkeys showed that tool use stretches the brain's map of the body. In VR we can ask what causes the stretch, active control or timing, by changing the tool in ways that are impossible with a real rake.
        watch: Controller vibration is coarse; check for cybersickness; the delay must be noticeable but not frustrating.

  marks:
    # ---- theories -----------------------------------------------------------
    - page: 1
      type: framework
      title: Four ideas of embodied cognition
      text: >-
        Interacting with tools changes how we think and perceive; we think with our bodies, not just our brains; we know more by doing
        than by seeing; and at times we literally think with things.
      quote: we think with our bodies not just with our brains
    - page: 2
      type: theory
      title: Thinking is distributed and interactive
      text: >-
        Older views placed thought inside the head, with gesture and speech only expressing it. On newer accounts thinking is spread
        over brain, body and world, so changing the body changes the possible trajectories of thought.
      quote: Body movement can literally be part of thinking.
    - page: 7
      type: theory
      title: Tools are absorbed into the body schema
      text: >-
        We code nearby space by what is within reach. When we use a tool, the brain's map of the body extends to the tool's tip, so
        the tool becomes part of our functioning body and redefines our peripersonal space.
    - page: 10
      type: concept
      title: Enactive landscape
      text: >-
        The world we perceive depends on our goals, tools and skills. Picking up a tool changes what we see as possible: designers
        create enactive landscapes by designing tools.
      quote: the structure that an agent cocreates with the world when he or she acts in a goal-oriented manner
    - page: 11
      type: theory
      title: Tools change our conceptions
      text: >-
        Activity produces situated, ad hoc concepts (Barsalou). Each tool multiplies them, which is why design is never finished:
        new tools create new behaviours, which create new design needs.
    - page: 18
      type: concept
      title: Projection and anchoring
      text: >-
        Between perceiving and imagining lies projection: attaching a mental image to a physical structure that anchors it. A marked
        movement is such an anchor for the full movement the dancer has in mind.
      quote: Projection is a mental process akin to attaching a mental image to a physical structure.
    - page: 26
      type: theory
      title: Thinking with things
      text: >-
        Manipulating an object is an external simulation: it revises our expectations of what will happen next. Choosing whether to
        simulate in the head or with real things is a matter of cost.
      quote: when people think with things they rely on the world to simulate itself and in so doing they stimulate themselves.

    # ---- experiments --------------------------------------------------------
    - page: 8
      type: experiment
      title: The enlarged virtual hand (Iriki)
      text: >-
        Monkeys controlled a joystick while seeing a video image of their hand. When the image was enlarged, the brain's hand area
        expanded as if the real hand had grown, so body maps can be remapped.
    - page: 15
      type: experiment
      title: Marking study with expert dancers
      text: >-
        Ten dancers from Random Dance learned new 55-second phrases and practised each in one of three conditions: full-out, marking,
        or lying down and simulating mentally (3×3 Latin square). Performance was graded on technicality, memory, timing and dynamics.
    - page: 17
      locked: ""
    - page: 19
      type: experiment
      title: Tic-tac-toe in the head
      text: >-
        24 people played by calling out moves, over a blank grid or a blank page. On 3×3 boards the grid made no difference. On 4×4
        boards it saved 1.6 s per move (p = .002), mostly for weak visualizers (3.7 s, p = .014).
    - page: 21
      type: experiment
      title: Mental abacus
      text: >-
        Students who calculate on an imagined abacus flick their fingers as if moving beads. When they cannot move their hands, their
        performance suffers (Frank & Barner 2012).
      quote: Hand motions seem to improve mental simulation.

    # ---- important for my work ----------------------------------------------
    - page: 5
      type: important
      title: Simplified models can beat the real thing
      text: >-
        Working with an imperfect, simplified model lets people focus on the aspect they care about and has a lower cost. For maths in
        VR, the most realistic object is not always the best one to learn with.
      quote: Sometimes working with a simpler thing, even if it is imperfect, is better than working with a perfect thing.
    - page: 8
      type: important
      title: Feedback timing makes remote bodies feel like ours
      text: >-
        Operators can absorb remote "body parts" from the start, if action and feedback are close in time. This links directly to my
        MSc work on asynchronous visuomotor feedback in VR.
      quote: as long as action and feedback are close enough in time
    - page: 20
      type: important
      title: External structure helps weak visualizers
      text: >-
        When spatial memory load is high, everyone benefits from external structure, and people with weaker imagery benefit most. In
        VR maths, scaffolds matter more for some learners than others.
      quote: at some point, when a spatial memory task becomes hard enough, everyone benefits from external structure.
    - page: 22
      type: important
      title: Work on one aspect at a time
      text: >-
        Marking lets dancers practise aspects of a movement one by one, without the interference of doing everything at once. Bodies
        also help manage attention, as pointing does when counting.
      quote: Marking “keeps the dancers honest”.
    - page: 23
      type: important
      title: Watching is not the same as doing
      text: >-
        Force, resistance and balance are felt, not seen, so an observer misses what the mover knows. In collaborative VR, the partner
        who only watches the manipulation learns something different.
      quote: We feel more than we show.

    # ---- ideas for my thesis ------------------------------------------------
    - page: 5
      type: idea
      title: A "marking mode" for maths objects
      text: >-
        Let learners first handle a stripped-down version of a 3D shape (only its edges, or only its symmetry axes) to explore one
        aspect at a time, then switch to the full object.
    - page: 8
      type: idea
      title: Shared manipulatives and latency
      text: >-
        Test whether a dyad's shared virtual object is absorbed into both partners' peripersonal space, and whether adding latency to
        one partner's feedback breaks it, building on my MSc paradigm.
    - page: 20
      type: idea
      title: Projection scaffolds for weak visualizers
      text: >-
        Offer toggleable anchors in VR geometry tasks (grids, axes, ghost outlines). Measure imagery with VVIQ and predict that weak
        visualizers gain the most from them.
    - page: 21
      type: idea
      title: Gestures as a window on mathematical thinking
      text: >-
        Use VR hand tracking to log the gestures partners make while reasoning about a shape, and test whether restricting the hands
        lowers performance, as with the mental abacus.
    - page: 24
      type: idea
      title: Rotate the doer and the observer
      text: >-
        In dyads, swap who manipulates and who watches during a task. Compare what each learns, since the hands know things the eyes
        do not.
      quote: The hands know things the eyes do not

    # ---- where this paper goes in the papers I will write --------------------
    # ---- from my Zotero: my notes and highlights ----
    - page: 2
      para: 2
      type: important
      from: highlight
      title: Design needs science fiction, and cognitive science
      text: "Kirsh's motto: to imagine future interfaces, designers need bold fiction, and that fiction only works if it rests on how cognition
        really works."
      quote: Good design needs good science fiction; and good science fiction needs good cognitive science
    - page: 2
      para: 5
      type: important
      from: highlight
      title: Gripped, not absorbed
      text: An object might become part of thinking just by being handled in the right way, even if the brain never maps it as part of the
        body. In VR, virtual objects might join thinking without full embodiment.
      quote: that if an object is cognitively gripped in the right way then it can be incorporated into our thinking process even if it
        is not neurally absorbed?
    - page: 3
      para: 5
      type: important
      from: highlight
      title: More actions, more affordances
      text: The more actions you can perform, the more possibilities you notice. Skills and tools widen what a learner sees.
      quote: actions you can perform the more affordances you register
    - page: 6
      para: 3
      type: theory
      from: highlight
      title: Every action has a covert stage
      text: "Quoting Jeannerod: each executed action has a covert, simulated stage, but a covert action need not become overt. Imagining
        and doing share machinery."
      quote: Every overtly executed action implies the existence of a covert stage, whereas a covert action does not necessarily turn out
        into an overt action
    - page: 9
      para: 1
      type: gap
      from: highlight
      title: What makes a tool feel natural?
      text: "Kirsh's open questions: what makes a tool, prosthetic or digital helper feel natural, and where are the limits of adapting
        to immersion? Exactly what VR design runs into."
      quote: what makes a tool, prosthetic, or digital helper work and feel natural? What are the limits to neuroadaptation driven by immersion?
    - page: 9
      para: 5
      type: important
      from: highlight
      title: Skill changes what you see
      text: Skilled tool users notice more tool-related features and affordances than novices (a smoker sees ashtrays everywhere).
      quote: Accordingly, skill affects what an agent will see in a given situation; skilled tool users detect more tool-relevant features,
        tool-related affordances, than lesser-skilled users
    - page: 19
      para: 4
      type: important
      from: highlight
      title: Imagination as a VR game
      text: "Kirsh compares projection to augmented reality and imagination to building a virtual reality game: a direct bridge from his
        ideas to VR."
      quote: Imagination, at its best, is like creating a virtual reality game.
    - page: 20
      para: 5
      type: important
      from: highlight
      title: Watching others can teach a movement
      text: Two studies found that people who only watched others perform a dance movement learned it about as well as people who practised
        it full-out.
      quote: Both found that subjects who simply observed other people performing a dance movement were able to learn that movement comparably
        to those practicing the movement fullout themselves
    - page: 22
      para: 5
      type: theory
      from: highlight
      title: Three theories behind watching and doing
      text: "Common coding (Prinz 1997): perception and action share one code. Motor resonance: watching activates our own motor system.
        Enactive perception (O'Regan & Noë 2001): we co-create what we perceive."
      quote: the common coding theory [Prinz 1997], that is, the idea that motor and visual perception share a common world-oriented code
    - page: 26
      para: 1
      type: important
      from: highlight
      title: The world does part of the reasoning
      text: When we think with things, the object's own behaviour carries part of the reasoning; we revise our expectations as it changes.
      quote: The world executes part of the reasoning process
    - page: 27
      para: 3
      type: gap
      from: highlight
      title: A modern conception of the body
      text: "Kirsh: we still lack theory and evidence for a modern conception of our bodies and of what they can do with tools. My note
        on this page: the modern body?"
      quote: We also need theory and empirical support for a more modern conception of our bodies and what they are capable of doing.
    - page: 27
      para: 1
      type: gap
      from: highlight
      title: Mapping the body onto a tool
      text: How do our own actions map onto the actions a tool makes possible? An open question for any VR body or controller.
      quote: What is the mapping function between our own action repertoire and “tool” created repertoires?
    - page: 2
      para: 3
      type: idea
      from: note
      title: Cognitive functions as tools in VR
      text: How do we design a tool that really works like attention or memory? Which cognitive functions could be designed as tools in
        VR? Maybe we should regroup the categories of cognitive functions.
    - page: 2
      para: 4
      type: idea
      from: note
      title: Feel pi with the body
      text: Design an embodied way to understand, see and feel pi. (Maybe you win the Nobel prize.)
    - page: 3
      para: 3
      type: idea
      from: note
      title: A stronger body, a braver mind
      text: If we strengthen our body, by building muscle and going to the gym, we may change our belief that we can do hard things, even
        mental ones.
    - page: 5
      para: 4
      type: idea
      from: note
      title: Three levels of model in my VR task
      text: In my VR work I can offer three levels of model (simple, medium and difficult) and see which one participants choose to work
        with, and how.
    - page: 6
      para: 1
      type: idea
      from: note
      title: A history of tools that changed cognition
      text: "A history of the tools that changed our cognition and our brains: how we coped with them, which survived, and which disappeared
        over time."
      original: یه تاریخچه از تول ها و ابزار های مختلف که تونسته کاگنیشن مارو عوض کنه و مغز ما رو و ما چجوری با اون کوپ کردیم و کدوم ابزارها
