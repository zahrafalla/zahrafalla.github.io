  cites: []
  summary: >-
    The classic review of grounded cognition. Cognition is not computation on abstract, amodal symbols but rests on simulations
    (reenactments of perceptual, motor and introspective states), bodily states and situated action. Reviews evidence from perception,
    memory, concepts, language, thought, social cognition and development, and lists the open theoretical and methodological issues.
  experiments:
    - id: property
      title: Verifying properties of concepts
      page: 11
      own: false
      by: Solomon & Barsalou 2004
      n: ~
      who: participants
      design: verify whether a property belongs to a concept (HORSE, mane)
      conditions: [Small properties, Large properties]
      manipulated: [Property size]
      measured: [Verification time, Errors]
      tags: [rt, perf]
      tools: [Property verification task]
      result: Larger properties took longer to verify, as if participants simulated the object.
      vr:
        title: Where the eyes go when you think of a roof
        principles:
          - Perceptual simulation
          - Eye movements
        scene: An empty room. Words appear in the middle of the view (HORSE, mane).
        task: Say as fast as possible whether the property belongs to the concept.
        conditions:
          - name: Size
            does: small or large properties
          - name: Location
            does: properties at the top or the bottom of the object (roof or cellar)
          - name: Object shown
            does: a faint outline of the object is there, or the room stays empty
        measures:
          - response time
          - gaze direction (do the eyes go up for a roof even in an empty room?)
          - pupil size as a sign of effort
        why: If people understand a concept by simulating the object, checking a property should look like inspecting it, and the eyes should move to where the property would be. Headset eye tracking makes the simulation visible.
        watch: Match words for frequency and length; keep size and location from confounding each other.

  marks:
    - page: 1
      type: framework
      title: Grounded cognition
      text: >-
        Rejects the view of cognition as symbol processing separate from perception and action. Modal simulations, bodily states and
        situated action underlie cognition.
      quote: grounded cognition proposes that modal simulations, bodily states, and situated action underlie cognition.
    - page: 2
      type: concept
      title: Simulation
      text: >-
        Experiences leave multimodal traces (how a chair looks, feels, the act of sitting). Knowledge is used by reactivating, or
        simulating, these traces.
      quote: Simulation is the reenactment of perceptual, motor, and introspective states acquired during experience with the world, body, and mind.
    - page: 3
      type: important
      title: Grounded rather than only embodied
      text: >-
        "Embodied" wrongly suggests that bodily states are always needed. Cognition is grounded in several ways, and the body is only one
        of them. Worth keeping in mind for my own terms.
      quote: cognition is typically grounded in multiple ways, including simulations, situated action, and, on occasion, bodily states.
    - page: 4
      type: important
      title: Simulations are partial
      text: >-
        Grounded theories do not claim full recreations of experience: simulations are partial and can be biased, which fits Kirsh's
        imperfect models.
      quote: simulations are typically partial recreations of experience that can contain bias and error
    - page: 6
      type: theory
      title: Perceptual symbol systems
      text: >-
        Barsalou's PSS shows that simulation can still do the symbolic work (types, inference, recursion, propositions) using one shared
        multimodal system across memory, concepts and perception.
    - page: 7
      type: theory
      title: Social simulation and mirror circuits
      text: >-
        We understand others' actions and feelings by simulating them in our own systems; mirror neurons respond most to the goal of an
        action, so they help infer intentions.
      quote: To recognize and understand another agent’s action, primates simulate the perceived action in their own motor system.
    - page: 8
      type: experiment
      title: Seeing objects prepares actions
      text: >-
        A cup handle activates a grasp simulation (Tucker & Ellis), tuned to the object's size and orientation, even when only its name is
        read.
    - page: 9
      type: important
      title: Space is shaped by the body
      text: >-
        Space is not perceived the same in all directions; it depends on the body and what it can do. Near space even extends with arm
        length, which matters for avatars and reach in VR.
      quote: people’s perception of near space extends further outward as their arm length increases
    - page: 10
      type: important
      title: Mental rotation recruits the motor system
      text: >-
        Imagining a rotation follows bodily constraints, and mentally rotating objects comes with motor simulations of turning them.
        Directly relevant to geometry.
      quote: mental rotation of visual objects is accompanied by motor simulations of making them turn
    - page: 12
      type: experiment
      title: Simulation in language
      text: >-
        Reading "the ranger saw the eagle in the sky" speeds naming a picture of an eagle with spread wings; action words activate the
        matching motor areas within a few hundred milliseconds.
    - page: 13
      type: experiment
      title: Gestures and physical reasoning
      text: >-
        Gestures help speakers find words and help listeners understand. In reasoning about gears and pulleys, people simulate, and doing
        the related actions improves their inferences.
      quote: Carrying out associated actions can improve inference
    - page: 14
      type: important
      title: Mathematical discovery as simulation
      text: >-
        Mathematicians' and scientists' discoveries are often described as arising from simulation, and abstract ideas such as time are
        reasoned about through space.
      quote: scientific and mathematical discoveries typically arise from simulation
    - page: 15
      type: important
      title: Joint attention and timing
      text: >-
        Mirror circuits are not enough for social activity: coordinating with someone also needs joint attention and timing. Individual
        differences in simulation track empathy.
      quote: Joint attention and timing are also central in social coordination
    - page: 16
      type: theory
      title: Simulations are causal
      text: >-
        TMS over motor areas changes language processing and manipulated bodily states change performance, so simulations are not mere
        by-products.
      quote: significant evidence exists already that they are not epiphenomenal.
    - page: 18
      type: important
      title: Abstract concepts need situations
      text: >-
        Abstract concepts draw on introspection and on background situations. An abstract idea alone is hard; in a situation it becomes
        much easier.
      quote: Processing an abstract concept by itself is difficult but becomes much easier when a background situation contextualizes it.
    - page: 7
      type: idea
      title: Visible or hidden partner hands
      text: >-
        In the shared VR space, compare dyads who see the partner's hands moving the object with dyads who only see the object move, to
        test whether mirroring helps the observer learn.
    - page: 9
      type: idea
      title: Reach and manipulability
      text: >-
        Place geometric objects within or beyond each partner's reach and test whether reachable objects are explored and understood
        differently.
    - page: 15
      type: idea
      title: Measure joint attention
      text: >-
        Use eye tracking to measure when partners look at the same part of a shape, and how well their movements are timed, as predictors
        of collaborative learning.
    - page: 18
      type: idea
      title: Situated versus bare maths tasks
      text: >-
        Present the same geometry problem either as bare shapes or inside a meaningful VR situation (building a shelter, packing a box)
        and compare understanding.
    # ---- famous people named in the paper (2026-11-24) ----
    - page: 3
      para: 1
      type: people
      title: "Stephen Kosslyn: mental imagery"
      text: Psychologist (Harvard) who showed that mental images are picture-like and use the visual cortex. Barsalou calls imagery the best-known case of simulation.
    - page: 3
      para: 6
      type: people
      title: "Allan Paivio: dual coding"
      text: Psychologist (1925–2016) whose Dual Code Theory says that a verbal system and an imagery system work together. Barsalou presents it as an early account of language and simulation working together.
    - page: 3
      para: 6
      type: people
      title: "Zenon Pylyshyn: the critic of imagery"
      text: Cognitive scientist (1937–2022) who argued that images are really propositions, the side Barsalou opposes in the 'imagery debate'. Barsalou recalls how the new cognitivists dismissed imagery until the evidence won.
    - page: 4
      para: 1
      type: people
      title: "John Searle and Stevan Harnad: symbols need grounding"
      text: Searle's Chinese room (1980) and Harnad's symbol grounding problem (1990) argue that symbols manipulated by rules have no meaning until they are grounded. Barsalou lists them among the critiques of amodal symbols.
    - page: 6
      para: 5
      type: people
      title: "Antonio Damasio: convergence zones"
      text: Neuroscientist known for the somatic-marker hypothesis; his convergence-zone architecture (1989) shows how separate sensory areas could be tied together. Barsalou uses it as a way to implement simulation in the brain.
    - page: 3
      para: 2
      type: people
      title: "Arthur Glenberg: memory is for action"
      text: Psychologist who argued that memory evolved to serve action and showed that understanding a sentence uses the action system. The name Barsalou cites most after his own (10 times).
  uses:
    - paper: embodied-learning
      section: intro
      page: 1
      type: theory
      passage: grounded cognition proposes that modal simulations, bodily states, and situated action underlie cognition.
      suggest: >-
        Grounded cognition holds that knowledge is not stored as abstract symbols but rests on simulations, bodily states and situated
        action (Barsalou, 2008).
    - paper: embodied-learning
      section: background
      page: 2
      type: theory
      passage: Simulation is the reenactment of perceptual, motor, and introspective states acquired during experience with the world, body, and mind.
      suggest: >-
        We use simulation in Barsalou's (2008) sense: the reenactment of perceptual, motor and introspective states acquired during
        experience.
    - paper: embodied-learning
      section: background
      page: 3
      type: important
      passage: cognition is typically grounded in multiple ways, including simulations, situated action, and, on occasion, bodily states.
      suggest: >-
        We speak of grounded as well as embodied learning, because cognition is grounded in several ways and bodily states are only one of
        them (Barsalou, 2008).
    - paper: embodied-learning
      section: discussion
      page: 14
      type: important
      passage: scientific and mathematical discoveries typically arise from simulation
      suggest: >-
        If mathematical discoveries often arise from simulation (Barsalou, 2008), training learners to simulate, with and without their
        bodies, is a plausible route to deeper understanding.
    - paper: embodied-learning
      section: conclusion
      page: 16
      type: theory
      passage: Nevertheless, significant evidence exists already that they are not epiphenomenal.
      suggest: >-
        Bodily simulations are not a by-product of thinking but play a causal role in it (Barsalou, 2008), and learning designs should
        treat them that way.
    - paper: cel-math-vr
      section: related
      page: 7
      type: theory
      passage: To recognize and understand another agent’s action, primates simulate the perceived action in their own motor system.
      suggest: >-
        Watching a partner manipulate an object can engage the observer's own motor system (Barsalou, 2008), which may allow the observing
        partner to learn from the one acting.
    - paper: cel-math-vr
      section: related
      page: 15
      type: important
      passage: Joint attention and timing are also central in social coordination
      suggest: >-
        Collaboration relies on joint attention and timing (Barsalou, 2008), so a shared VR task should make each partner's attention and
        actions visible to the other.
    - paper: cel-math-vr
      section: design
      page: 9
      type: important
      passage: people’s perception of near space extends further outward as their arm length increases
      suggest: >-
        Because perceived near space depends on the body's reach (Barsalou, 2008), the shared objects are placed within both partners'
        reach so that each can treat them as manipulable.
    - paper: cel-math-vr
      section: method
      page: 10
      type: important
      passage: mental rotation of visual objects is accompanied by motor simulations of making them turn
      suggest: >-
        The tasks include rotating solids, since mental rotation recruits motor simulation (Barsalou, 2008). We compare rotating the
        object by hand with watching the partner rotate it.
    - paper: cel-math-vr
      section: limits
      page: 18
      type: important
      passage: Processing an abstract concept by itself is difficult but becomes much easier when a background situation contextualizes it.
      suggest: >-
        Abstract mathematical concepts may be easier to grasp inside a meaningful situation (Barsalou, 2008); future work should compare
        situated and bare versions of the tasks.

