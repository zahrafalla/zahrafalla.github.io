- id: chatain-2025
  title: "Concreteness and Abstraction in Mathematics Education: A Taxonomy of the Semantic Landscape"
  authors: Julia Chatain, Charlotte Müller, Keny Chatain, Leon Calabrese, Manu Kapur
  cite: Chatain et al. 2025
  short: CH25
  color: "#e5c53a"
  year: 2025
  venue: Educational Psychology Review 37, Article 92
  doi: 10.1007/s10648-025-10073-9
  pages: 49
  read: 2026-11
  category: maths
  ideas: [concreteness, grounded, metaphor, design, maths, language]
  builds_on: [dewey-1910, bruner-1966, papert-1980, harnad-1990, wilensky-1991, lakoff-nunez-2000, kaminski-2008, chalmers-2011, fyfe-2014]
