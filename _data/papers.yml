      type: experiment
      passage: >-
        In a controlled experiment run with 128 students, participants who directly or vicariously engaged activities with the MIT-P
        outperformed a control group on conceptual items
      suggest: >-
        Embodied designs can improve mathematics learning. In the Mathematical Imagery Trainer, children who moved their hands to keep a
        screen green discovered proportion and outperformed a control group on conceptual items (Abrahamson & Lindgren, 2014).
    - paper: cel-math-vr
      section: design
      page: 6
      type: important
      passage: >-
        The learning environment should be designed so that somatic actions—ranging from the movement of a single finger to the leaping of
        one’s entire body—become coupled with the environment via action–feedback loops.
      suggest: >-
        Following the embodied design principles of Abrahamson and Lindgren (2014), every hand movement is coupled to immediate visual
        feedback, and grids and numbers are introduced only after the dyad has found a bodily strategy.
    - paper: cel-math-vr
      section: method
      page: 7
