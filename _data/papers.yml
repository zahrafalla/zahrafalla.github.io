    - page: 25
      para: 6
      type: idea
      from: note
      title: Causal mechanics of objects in my VR tasks
      text: Use the causal mechanics of objects (how they behave, not only their shape) in my VR tasks.

  uses:
    # Paper A · Embodied learning (beyond VR)
    - paper: embodied-learning
      section: intro
      page: 2
      type: theory
      passage: On newer accounts, thinking is a process that is distributed and interactive. Body movement can literally be part of thinking.
      suggest: >-
        Learning has long been treated as something that happens in the head, with the body only expressing what the mind already
        knows. Embodied accounts reject this split: thinking is spread over brain, body and world, so movement can itself be part of
        thinking (Kirsh, 2013).
    - paper: embodied-learning
      section: intro
      page: 14
      type: important
      passage: >-
        If our results generalize, then procedures and skills, in particular, might be better taught by a process akin to marking, where
        we create little models of things, or use our own bodies to pantomime what we must do.
      suggest: >-
        If the body takes part in thinking, it should take part in learning too. Kirsh (2013) suggests that skills may be better taught
        when learners model them with their own bodies, a claim this paper examines beyond virtual environments.
    - paper: embodied-learning
      section: background
      page: 10
      type: theory
      passage: >-
        Let us introduce the idea of an enactive landscape as the structure that an agent cocreates with the world when he or she acts in
        a goal-oriented manner.
      suggest: >-
        We use Kirsh's (2013) notion of an enactive landscape, the world a learner co-creates while acting towards a goal, to describe
        how tools, gestures and manipulatives change what a learning task affords.
    - paper: embodied-learning
      section: background
      page: 26
      type: theory
      passage: >-
        My hypothesis here is that when people think with things they rely on the world to simulate itself and in so doing they stimulate
        themselves.
      suggest: >-
        Handling an object can work as an external simulation: the object "simulates itself" and the learner updates their expectations
        by watching it change (Kirsh, 2013). Physical manipulatives in mathematics can be understood in the same way.
    - paper: embodied-learning
      section: method
      page: 16
      type: experiment
      passage: They marked the phrase, practiced it full out, or lay on their back and mentally simulated dancing the phrase.
      suggest: >-
        Each participant practises in three conditions: the full movement, a simplified "marking" version, and mental rehearsal without
        moving. The order is counterbalanced with a Latin square, following Kirsh (2013).
    - paper: embodied-learning
      section: method
      page: 15
      type: experiment
      passage: >-
        Each dancer’s performance was graded according to established criteria—technicality, memory, timing, and dynamics—first by the
        teacher in real time and later by two independent expert observers who reviewed the video frame by frame.
      suggest: >-
        Learning is the change between a baseline test and a test after practice. As in Kirsh's (2013) study, performance is graded on
        several dimensions by the instructor and by two independent coders from video.
    - paper: embodied-learning
      section: results
      page: 17
      type: experiment
      passage: >-
        Marking is the most effective overall method of practicing, being slightly more learning efficient than practicing full-out across
        the key dimensions of Memory, Technique, and Timing
      suggest: >-
        H1: Practising a simplified, partial version of a movement leads to at least as much learning as practising it in full. H2: Both
        bodily conditions lead to more learning than mental rehearsal (cf. Kirsh, 2013).
    - paper: embodied-learning
      section: discussion
      page: 23
      type: important
      passage: >-
        Vision provides only a fraction of the information needed to adapt interactively to rapidly changing forces in our environment or
        bodies.
      suggest: >-
        Watching is not the same as doing: force, resistance and balance are felt rather than seen (Kirsh, 2013). This may explain why
        learners who act gain more than learners who observe.
    - paper: embodied-learning
      section: conclusion
      page: 28
      type: theory
      passage: >-
        Once we understand the complex coordination between external and internal simulation, between doing things internally and doing
        things externally, we will begin to reach new heights in design
      suggest: >-
        Learning environments, digital or physical, will improve when we understand how learners coordinate what they simulate in their
        heads with what they do with their bodies (Kirsh, 2013).

    # Paper B · Collaborative embodied learning of mathematics in VR
    - paper: cel-math-vr
      section: intro
      page: 26
      type: theory
      passage: HCI is at a crossroads. We are entering a new world of physical, natural, and tangible interfaces.
      suggest: >-
        Virtual reality lets learners handle mathematical objects with their hands and bodies, part of what Kirsh (2013) calls a new world
        of physical, natural and tangible interfaces. We still know little about how this supports learning when two learners share the
        same virtual space.
    - paper: cel-math-vr
      section: related
      page: 21
      type: experiment
      passage: When they are not permitted to use their hands, their performance suffers
      suggest: >-
        Gesture is not a by-product of mathematical thinking: students who calculate on an imagined abacus perform worse when they cannot
        move their hands (Frank & Barner, 2012, discussed in Kirsh, 2013).
    - paper: cel-math-vr
      section: related
      page: 20
      type: experiment
      passage: For weak visualizers the grid strongly enhanced performance.
      suggest: >-
        External structure helps spatial reasoning most for people with weaker mental imagery (Kirsh, 2013), so individual differences in
        visualisation should be part of any study of mathematics in VR.
    - paper: cel-math-vr
      section: design
      page: 5
      type: important
      passage: Sometimes working with a simpler thing, even if it is imperfect, is better than working with a perfect thing.
      suggest: >-
        Since simplified models can be better to think with than the real thing (Kirsh, 2013), the environment offers a reduced view of
        each solid, showing only its edges and axes, next to the full object.
    - paper: cel-math-vr
      section: design
      page: 8
      type: important
      passage: >-
        Pilots of submersibles can be trained on remote enactive landscapes from the start as long as action and feedback are close enough
        in time.
      suggest: >-
        Virtual hands are only absorbed into the body when action and feedback are close in time (Kirsh, 2013). We therefore keep
        hand-tracking latency low, and equal for both partners.
    - paper: cel-math-vr
      section: method
      page: 24
      type: important
      passage: The hands know things the eyes do not
      suggest: >-
        Within each dyad, partners take turns manipulating the shared object and watching it, so each learner experiences both roles;
        the hands know things the eyes do not (Kirsh, 2013).
    - paper: cel-math-vr
      section: method
      page: 19
      type: experiment
      passage: To test for visual imagination capacity we administered the standard vividness of visual imagery test (VVIQ II) beforehand.
      suggest: >-
        Before the task, participants complete the VVIQ II, as in Kirsh (2013), so the effect of the VR scaffolds can be compared between
        weak and strong visualisers.
    - paper: cel-math-vr
      section: discussion
      page: 22
      type: important
      passage: It helps them to focus on aspects of their movement one by one
      suggest: >-
        Manipulating one aspect at a time may help partners keep track of a single mathematical property, much as marking helps dancers
        focus on one aspect of a movement (Kirsh, 2013).
    - paper: cel-math-vr
      section: limits
      page: 9
      type: theory
      passage: What are the limits to neuroadaptation driven by immersion?
      suggest: >-
        It remains open how far learners can absorb virtual tools, and a partner's actions, into their own sense of the body (Kirsh,
        2013). Longer studies are needed.

