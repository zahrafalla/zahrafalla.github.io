  cites: [chatain-2023]
  summary: >-
    Researchers use 'concrete' and 'abstract' to mean very different things. The authors coded how 368 maths-education papers use the
    two words and built a taxonomy of eleven axes: five at the interaction level between learner and representation (familiarity, interest,
    simplicity, relevance, sensoriality) and six at the mapping level between representation and concept (situatedness, experientiality,
    specificity, informality, approximation, physicality). A representation can be concrete on one axis and abstract on another, which
    explains several conflicting results.
  experiments:
    - id: taxonomy-corpus
      title: Coding how 368 papers use concrete and abstract
      page: 11
      own: true
      n: 368
      who: peer-reviewed maths-education papers from ERIC (4309 contexts)
      design: >-
        qualitative, data-driven: build the corpus, code the words, organise the codes into a taxonomy (reflexive thematic analysis)
      conditions: [Data preparation, Coding, Taxonomy]
      manipulated: [None (corpus analysis)]
      measured: [Words coded as related to concrete or abstract, Code frequency per paper]
      tags: [rating]
      tools: [ERIC database, Poppler, NLTK stemmer, Custom web annotation app, Word clouds, Thematic analysis]
      result: >-
        Eleven axes of meaning, five at the interaction level and six at the mapping level; specificity is the most discussed axis.
      vr:
        title: One axis at a time, a concreteness lab
        principles:
          - Unbundling concreteness
          - Factorial design
        scene: One maths task in a VR lab where each axis of the taxonomy has its own dial (how specific, how familiar, how rich to the senses, how interactive).
        task: The same problem in several versions, with only one axis changed between them.
        conditions:
          - name: Baseline
            does: a plain, abstract version
          - name: One axis up
            does: turn up a single axis (for example sensory richness only, or familiarity only)
          - name: Everything up
            does: the fully concrete version, as most studies use
        measures:
          - learning and transfer
          - preference and cognitive load
          - which axis explains the difference
        why: The taxonomy shows that "concrete" bundles many different things, which may explain why studies disagree. VR can pull them apart and test one at a time.
        watch: Many conditions; use a fractional factorial design or within-subject tasks.
    - id: cups
      title: Three cups as a mathematical group
      page: 26
      own: false
      by: Kaminski et al. 2008; De Bock et al. 2011; Trninic et al. 2020
      n: null
      who: students
      design: an abstract or a concrete example of a mathematical group, then transfer tasks
      conditions: [Abstract symbols, "Cups, full cup as identity", "Cups, empty cup as identity"]
      manipulated: [Kind of example, Familiarity of the example]
      measured: [Abstract transfer, Concrete transfer]
      tags: [perf, learn]
      tools: ["Cups filled 1/3, 2/3 and full", Ancient-game transfer task, Tennis-ball buckets]
      result: >-
        Abstract beat concrete on symbolic transfer; concrete won on concrete transfer; with a familiar empty-cup identity the abstract
        advantage disappeared.
      vr:
        title: Pouring the cups yourself
        principles:
          - Concrete and abstract examples
          - Action
          - Transfer
        scene: Three measuring cups of water on a table; each combination follows the hidden rules of a mathematical group.
        task: Learn the rules, then solve transfer problems in a new symbol system and in a new concrete story.
        conditions:
          - name: Symbols
            does: abstract symbols that combine on the table
          - name: Watch the cups
            does: see the cups being poured, with the empty cup as identity
          - name: Pour the cups
            does: pour them yourself, with the empty cup as identity
        measures:
          - learning test, symbolic transfer and concrete transfer
          - hand movements during transfer (do people mime pouring?)
        why: Kaminski found that abstract symbols transfer better, but Chatain shows that a familiar identity (the empty cup) removes this advantage. Concreteness is not one thing. VR asks whether doing the pouring differs from only seeing the cups.
        watch: The liquid physics must be stable; keep time on task equal.
    - id: manipulatives
      title: Physical or virtual manipulatives
      page: 27
      own: false
      by: Burns & Hamm 2011; Shurr et al. 2021
      n: null
      who: third and fourth graders; three elementary students with autism
      design: the same blocks as physical objects or on an iPad
      conditions: [Physical blocks, Virtual blocks]
      manipulated: [Physicality]
      measured: [Maths performance]
      tags: [perf]
      tools: [Physical blocks, iPad]
      result: >-
        A small, non-significant advantage for physical blocks with neurotypical children; virtual blocks worked better for the learners
        with autism.
      vr:
        title: How rich should virtual blocks be?
        principles:
          - Sensory load
          - Adaptivity
          - Inclusion
        scene: Base-ten blocks on a table, with a dial for how much the blocks give to the senses.
        task: Build and split numbers with the blocks, then solve place-value problems.
        conditions:
          - name: Real blocks
            does: physical blocks seen through mixed-reality passthrough
          - name: Rich VR blocks
            does: virtual blocks with sound, texture and vibration
          - name: Plain VR blocks
            does: flat virtual blocks with no sound
          - name: Learner group
            does: neurotypical and autistic learners
        measures:
          - accuracy and a place-value test
          - engagement and sensory overload (self-report, gaze aversion)
          - which version each learner prefers
        why: The review found that virtual blocks worked better for autistic learners, perhaps because they are predictable and less noisy. In VR, sensory richness becomes a dial, and each learner could choose it.
        watch: Co-design with autistic people; short sessions in a quiet room; consent and assent; follow the age guidance for headsets.
  marks:
    - page: 1
      para: 4
      type: important
      title: Concrete and abstract mean many things
      text: >-
        The paper's starting point: in maths education 'concrete' can mean specific, relatable, visual or tangible, and 'abstract' general,
        rigorous, vague or symbolic. People using the same word may not mean the same thing.
      quote: >-
        the word concrete can be used to mean specific, relatable, visual, and tangible, while the word abstract can be used as general,
        rigorous, vague, and symbolic
    - page: 2
      para: 1
      type: theory
      title: Is mathematics abstract or concrete?
      text: >-
        Formalists see mathematics as abstract; the embodied view (Lakoff & Núñez) sees it as concrete, grounded in bodily experience;
        others see it as the link between the two worlds.
      quote: >-
        others argued that it is concrete, such as proponents of the embodied perspective (Lakoff & Núñez, 2000)
    - page: 2
      para: 4
      type: important
      title: A spectrum, not two boxes
      text: >-
        Concrete and abstract are a spectrum, not a dichotomy, and the same object can be both: a symbol is abstract because it is formal,
        yet concrete to a mathematician because it is familiar.
      quote: >-
        while a mathematical symbol may be abstract because it is formal, it may also be concrete to a mathematician because it is familiar.
    - page: 4
      para: 1
      type: theory
      title: Vertical and horizontal abstraction
      text: >-
        In the vertical view, abstraction peels away details to reach ideal objects. In the horizontal view (Wagner), abstraction is translating
        between concrete presentations, which may support cognitive flexibility.
      quote: imperfect and somewhat unstable translation between symbolic systems
    - page: 6
      para: 3
      type: experiment
      title: Concrete examples can hurt transfer, or not
      text: >-
        Kaminski et al. (2008): pizzas, cups and tennis balls impaired transfer to abstract tasks. Follow-ups made the examples more relatable
        or aligned the test, and the effect disappeared.
      quote: >-
        the effectiveness of concrete representations may lie more in how relatable they are rather than in the sole fact that they exist
        in the real world.
    - page: 6
      para: 5
      type: concept
      title: The representational dilemma
      text: >-
        Students must make sense of both the representation and the concept it stands for (Rau 2017); success depends on the quality of
        that mapping and on the learner.
      quote: Students must make sense of both the representations and the concepts they represent
    - page: 7
      para: 1
      type: concept
      title: Concreteness fading
      text: >-
        Bruner's sequence: an enactive (physical) form, then an iconic (pictorial) form, then a symbolic form. What counts as concrete
        differs between STEM domains.
      quote: >-
        (1) an enactive form, which is a physical, concrete model of the concept; (2) an iconic form, which is a graphic or pictorial
        model; and finally (3) a symbolic form, which is an abstract model of the concept
    - page: 7
      para: 2
      type: people
      title: "Papert and Dewey: learning as concretion"
      text: >-
        Papert's gears turned equations into a 'comfortable friend'; Dewey saw understanding as turning the strange and perplexing into
        the plain and familiar.
      quote: >-
        understanding is changing something abstract, i.e., “strange and perplexing,” into something concrete, i.e., “plain and familiar”
    - page: 8
      para: 3
      type: concept
      title: Verbal disputes
      text: >-
        Chalmers (2011): a disagreement that exists only because people mean different things by a word. 'Maths is hard because it is
        abstract' can be agreed or denied depending on what 'abstract' means.
      quote: >-
        A dispute over S is (broadly) verbal when, for some expression T in S, the parties disagree about the meaning of T, and the dispute
        over S arises wholly in virtue of this disagreement regarding T.
    - page: 11
      para: 5
      type: experiment
      title: 368 papers, 4309 contexts
      text: >-
        They searched ERIC, kept 368 peer-reviewed papers, and cut out every passage around a word like concrete or abstract (4309 contexts).
      quote: >-
        From this sample, we could retrieve the content of 368 papers through open or institutional access, which constitutes our final
        sample
    - page: 12
      para: 5
      type: experiment
      title: Coding with two colours
      text: >-
        Four coders, two outsiders and two experts, highlighted in green the words related to concrete and in purple those related to
        abstract, in a web app; every context was coded twice.
      quote: >-
        select in green the words that are more related to concrete and in purple the words that are more related to abstract
    - page: 13
      para: 2
      type: idea
      title: Code my own material the same way
      text: >-
        Their two-colour coding is close to how I mark papers. I could code my VR task texts, or what learners say, for concrete and abstract
        words the same way.
    - page: 15
      para: 4
      type: framework
      title: Learner, representation, concept
      text: >-
        Any understanding of a concept is mediated by a representation. Axes sit at the interaction level (learner and representation,
        subjective) or at the mapping level (representation and concept, objective).
      quote: >-
        arguably the relationship between the learner and the concept will always be mediated by the representations of the concept known
        to the learner.
    - page: 16
      para: 4
      type: framework
      title: Eleven axes of concreteness
      text: >-
        Interaction level: familiarity, interest, simplicity, relevance, sensoriality. Mapping level: situatedness, experientiality, specificity,
        informality, approximation, physicality. Each axis runs from abstract to concrete and comes with a design question.
    - page: 16
      para: 6
      type: important
      title: Subjective axes have to be measured
      text: >-
        Designers can aim at the interaction-level axes (interest, familiarity…), but whether they happen depends on the learner, so they
        must be measured. Mapping-level axes depend only on the design.
      quote: only actual measurement with target learners can ensure that the desired effect indeed happened.
    - page: 17
      para: 4
      type: important
      title: Concrete on one axis, abstract on another
      text: >-
        An excavator simulation is virtual (abstract on physicality) but situated in real life (concrete on situatedness). Equations are
        concrete for a mathematician and abstract for a student.
      quote: one representation may now be abstract along one dimension and concrete along another.
    - page: 19
      para: 2
      type: concept
      title: Sensoriality
      text: >-
        How many senses the representation reaches, and how strongly. It depends on the design and on the learner: audio feedback reaches
        no one who cannot hear it or never triggers it.
      quote: a more concrete representation thus leverages more senses or the same sense with more stimulation.
    - page: 20
      para: 2
      type: concept
      title: Experientiality
      text: >-
        Symbols are arbitrary and have to be explained; an experiential mapping carries meaning in itself, from shared human experience.
        It is distinct from sensoriality and physicality, and can even be imaginative.
      quote: >-
        while experiential representations (experientiality → concrete) intrinsically embed meaning, symbolic ones (experientiality →
        abstract) need to be explained.
    - page: 21
      para: 2
      type: idea
      title: Marking as a designed approximation
      text: >-
        Kirsh's marking is approximate on purpose: concrete on experientiality, loose on approximation. I could test which approximations
        help and which mislead (like coloured unit cubes).
    - page: 21
      para: 5
      type: important
      title: Physicality and the reality–virtuality continuum
      text: >-
        Physical versus virtual is its own axis; AR and augmented virtuality sit in the middle (Milgram). A VR task is abstract on physicality
        but can be concrete on every other axis.
      quote: >-
        Hybrid forms, such as physical objects overlaid by virtual ones using Augmented Reality, would land at the center of the spectrum.
    - page: 22
      para: 2
      type: experiment
      title: What the literature talks about
      text: >-
        Specificity is the most discussed axis, mostly as abstract; approximation the least. Physicality and approximation are mostly
        discussed as abstract, situatedness and sensoriality as concrete.
      quote: >-
        the most discussed dimension is specificity, mostly on the abstract side, while approximation is less commonly mentioned.
    - page: 23
      para: 5
      type: theory
      title: How the axes affect each other
      text: >-
        Design choices (mapping) shape experience (interaction): physicality raises sensoriality; situatedness raises familiarity and
        relevance; experientiality raises sensoriality, familiarity and interest; informality may ease maths anxiety.
      quote: >-
        relationships between objective axes, at the mapping level, and subjective axes, at the interaction level, are quite interesting
        because they tell us how design choices impact learners’ perception and subjective experiences.
    - page: 25
      para: 4
      type: gap
      title: Which axes really matter for learning?
      text: >-
        The relationships between the axes are mostly untested. Meta-analyses could show which design choices raise which experiences,
        and then simplify the taxonomy.
      quote: >-
        we believe that a series of meta-analyses exploring these relationships in depth can lead to an even more refined understanding
        of how to design concrete representations
    - page: 26
      para: 2
      type: experiment
      title: Situated is not the same as familiar
      text: >-
        Kaminski's cups were real objects but an unfamiliar group (a full cup as the identity). Trninic made the empty cup the identity,
        and the advantage of abstract examples disappeared.
      quote: >-
        the representation chosen by K and D is less familiar (familiarity → abstract) than the one chosen by T (familiarity →concrete).
    - page: 27
      para: 4
      type: experiment
      title: Pipes made graphs feel relevant
      text: >-
        In Chatain et al. (2023) a situated pipe network and an abstract graph were both interactive; engagement was the same, but only
        the pipes made students see the problem as relevant.
      quote: >-
        simply allowing students to interact with a representation is not sufficient to allow them to relate to the problem or to perceive
        it as relevant to them.
    - page: 28
      para: 3
      type: experiment
      title: Virtual blocks helped learners with autism
      text: >-
        Neurotypical children did slightly better with physical blocks (not significant); three learners with autism did better with virtual
        ones, which were steadier and more accurate. Less sensory input can suit some learners.
      quote: >-
        This distinction could potentially explain why learners with ASD favored the more abstract representation.
    - page: 28
      para: 5
      type: idea
      title: Let learners tune sensoriality
      text: >-
        In a VR maths task, offer adjustable sensory richness (sound, haptics, visual detail) and see who chooses less.
    - page: 30
      para: 3
      type: important
      title: Concreteness fading can start virtual
      text: >-
        The enactive stage need not be physical: virtual–representational–abstract sequences start with a virtual manipulative, concrete
        on sensoriality but abstract on physicality.
      quote: >-
        leverage a virtual manipulative (sensoriality → concrete still, but physicality → abstract) in the first stage.
    - page: 32
      para: 2
      type: important
      title: Ask why a concept feels abstract
      text: >-
        Abstract because it cannot be seen? Make it visible. Because it is universal? Show the same concept in several problems. Because
        it is unfamiliar? Link it to learners' experience.
      quote: >-
        Is the concept abstract because it cannot be seen? Then, maybe we should design visible representations.
    - page: 33
      para: 3
      type: gap
      title: Limits of the taxonomy
      text: >-
        Two analysts shared one supervisor; only ERIC was searched (missing computer-science education work); lists of adjectives were
        hard to code; and eleven axes are complex to use.
    - page: 34
      para: 5
      type: gap
      title: Concepts nobody can perceive
      text: >-
        Molecules and the atmosphere are physical but cannot be perceived (abstract on sensoriality); the taxonomy may help design representations
        for them in other sciences.
      quote: >-
        they are often not perceptible (sensoriality → abstract), either because they are too small, for example, molecules, or too big,
        for example, the atmosphere
    - page: 44
      para: 1
      type: idea
      title: Place my VR conditions on the template
      text: >-
        Before running my VR maths study, place each condition on the blank template (Fig. 24), so I can say exactly which kind of concreteness
        I change and which I keep.
    # ---- famous people named in the paper (2026-11-24) ----
    - page: 2
      para: 2
      type: people
      title: "Emily Fyfe: concreteness fading"
      text: Psychologist; concreteness fading (Fyfe et al., 2014) moves from concrete to idealised representations, and with Nathan (2019) she argued that concrete and abstract form a spectrum. The most cited name in this paper (15 times).
    - page: 2
      para: 1
      type: people
      title: "Lakoff and Núñez: mathematics is embodied"
      text: "Linguist George Lakoff and cognitive scientist Rafael Núñez argued that mathematical ideas come from bodily metaphors (Where Mathematics Comes From, 2000). The paper cites them as the embodied view: mathematics is concrete."
    - page: 2
      para: 2
      type: people
      title: "Jennifer Kaminski: abstract examples transfer better"
      text: Psychologist whose Science paper (2008) found that generic, abstract examples transferred better than concrete ones. One of the conflicting results that this taxonomy hopes to sort out.
    - page: 4
      para: 4
      type: people
      title: "Stevan Harnad: the symbol grounding problem"
      text: Cognitive scientist who argued that symbols are meaningless until they are grounded. The paper uses him to say that mathematical symbols could be redesigned to carry meaning, for example as more iconic forms.
    - page: 5
      para: 1
      type: people
      title: "Imre Lakatos: proofs and refutations"
      text: "Philosopher of mathematics (1922–1974) who showed that mathematics grows through conjectures, proofs and counterexamples. Cited for fallibilism: mathematics as human practice, not perfect truth."
    - page: 2
      para: 2
      type: people
      title: "Jerome Bruner: enactive, iconic, symbolic"
      text: "Psychologist of the cognitive revolution (1915–2016): knowledge moves from action to images to symbols. The paper traces concreteness fading back to him (1974)."
    - page: 2
      para: 6
      type: people
      title: "David Chalmers: verbal disputes"
      text: Philosopher known for the 'hard problem' of consciousness and the extended mind. His 'verbal disputes' (2011), disagreements that are really about the meaning of words, are the reason the paper defines 'concrete' and 'abstract' carefully.
    - page: 21
      para: 5
      type: people
      title: "Paul Milgram: the reality–virtuality continuum"
      text: Engineer whose continuum (1994) runs from the real world to a fully virtual one, with augmented reality and augmented virtuality between. The paper aligns its physical–virtual axis with it, which matters for my VR work.
  uses:
    - paper: embodied-learning
      section: intro
      page: 1
      type: important
      passage: >-
        the word concrete can be used to mean specific, relatable, visual, and tangible, while the word abstract can be used as general,
        rigorous, vague, and symbolic.
      suggest: >-
        Even the words 'concrete' and 'abstract' are used in many senses: concrete can mean specific, relatable, visual or tangible (Chatain
        et al., 2025). Saying that bodily practice makes learning 'concrete' is therefore not enough; this paper states which kind of
        concreteness it adds.
    - paper: embodied-learning
      section: background
      page: 20
      type: concept
      passage: >-
        while experiential representations (experientiality → concrete) intrinsically embed meaning, symbolic ones (experientiality →
        abstract) need to be explained.
      suggest: >-
        Embodied designs aim at experiential concreteness: representations whose meaning comes from shared bodily experience, rather than
        symbols whose meaning has to be explained (Chatain et al., 2025).
    - paper: embodied-learning
      section: method
      page: 16
      type: important
      passage: only actual measurement with target learners can ensure that the desired effect indeed happened.
      suggest: >-
        Because familiarity, interest and relevance depend on the learner, the design alone cannot guarantee them (Chatain et al., 2025);
        we therefore measure them directly after practice.
    - paper: embodied-learning
      section: discussion
      page: 17
      type: important
      passage: one representation may now be abstract along one dimension and concrete along another.
      suggest: >-
        A simplified practice can be abstract along one dimension and concrete along another (Chatain et al., 2025): marking strips detail
        away, yet keeps the movement experiential.
    - paper: cel-math-vr
      section: related
      page: 21
      type: important
      passage: >-
        Hybrid forms, such as physical objects overlaid by virtual ones using Augmented Reality, would land at the center of the spectrum.
      suggest: >-
        Virtual reality is abstract on physicality but can be concrete on every other axis; augmented reality sits in between (Chatain
        et al., 2025, following Milgram et al., 1995).
    - paper: cel-math-vr
      section: design
      page: 24
      type: theory
      passage: >-
        Experientiality refers to the use of an experiential mapping of a concept, rather than a symbolic one. Often, especially in embodiment
        research (Ottmar et al., 2019; Nathan, 2021), this is done by leveraging bodily movements or object manipulations. Therefore,
        it is also likely to increase sensoriality and familiarity.
      suggest: >-
        We design the shared VR space around experiential mappings: learners act out mathematical relations with movements and object
        manipulations, which is also likely to make them more sensory and familiar (Chatain et al., 2025).
    - paper: cel-math-vr
      section: limits
      page: 28
      type: experiment
      passage: >-
        This distinction could potentially explain why learners with ASD favored the more abstract representation.
      suggest: >-
        More sensory richness is not better for everyone: learners with autism did better with virtual than with physical manipulatives
        (Chatain et al., 2025, on Shurr et al., 2021), so our design should let sensory load be adjusted.
    - paper: cel-math-vr
      section: discussion
      page: 32
      type: important
      passage: >-
        Is the concept abstract because it cannot be seen? Then, maybe we should design visible representations. Is it abstract because
        it is universal? Then, we may want to highlight the power of generalization by designing several problems relying on the same
        concept.
      suggest: >-
        Rather than calling a concept 'too abstract', we ask why: because it cannot be seen, because it is general, or because it is unfamiliar,
        and design for that reason (Chatain et al., 2025).
