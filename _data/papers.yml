- id: barsalou-2008
  title: Grounded Cognition
  authors: Lawrence W. Barsalou
  cite: Barsalou 2008
  short: "BAR"
  color: "#a07cf7"
  year: 2008
  venue: Annual Review of Psychology 59, 617–645
  doi: 10.1146/annurev.psych.59.103006.093639
  pages: 29
  first_page: 617
  read: 2026-11
  ideas: [grounded, simulation, body-schema, enactive, gesture, maths, metaphor, mirror, language, collaboration]
  builds_on: [gibson-1979, lakoff-johnson-1980, strack-1988, clark-1997, barsalou-1999, rizzolatti-craighero-2004]
  mentions: [barsalou, strack, lakoff, goldin-meadow, clark, johnson, rizzolatti, glenberg, gibson, alibali]
  cites: []
  summary: >-
    The classic review of grounded cognition. Cognition is not computation on abstract, amodal symbols but rests on simulations
    (reenactments of perceptual, motor and introspective states), bodily states and situated action. Reviews evidence from perception,
    memory, concepts, language, thought, social cognition and development, and lists the open theoretical and methodological issues.
  experiments:
    - id: property
      title: Verifying properties of concepts
      page: 11
      own: false
      by: Solomon & Barsalou 2004
      n: ~
      who: participants
      design: verify whether a property belongs to a concept (HORSE, mane)
      conditions: [Small properties, Large properties]
      manipulated: [Property size]
      measured: [Verification time, Errors]
      tags: [rt, perf]
      tools: [Property verification task]
      result: Larger properties took longer to verify, as if participants simulated the object.

  marks:
    - page: 1
      type: framework
      title: Grounded cognition
      text: >-
        Rejects the view of cognition as symbol processing separate from perception and action. Modal simulations, bodily states and
        situated action underlie cognition.
      quote: grounded cognition proposes that modal simulations, bodily states, and situated action underlie cognition.
    - page: 2
      type: concept
      title: Simulation
      text: >-
        Experiences leave multimodal traces (how a chair looks, feels, the act of sitting). Knowledge is used by reactivating, or
        simulating, these traces.
      quote: Simulation is the reenactment of perceptual, motor, and introspective states acquired during experience with the world, body, and mind.
    - page: 3
      type: important
      title: Grounded rather than only embodied
      text: >-
        "Embodied" wrongly suggests that bodily states are always needed. Cognition is grounded in several ways, and the body is only one
        of them. Worth keeping in mind for my own terms.
      quote: cognition is typically grounded in multiple ways, including simulations, situated action, and, on occasion, bodily states.
    - page: 4
      type: important
      title: Simulations are partial
      text: >-
        Grounded theories do not claim full recreations of experience: simulations are partial and can be biased, which fits Kirsh's
        imperfect models.
      quote: simulations are typically partial recreations of experience that can contain bias and error
    - page: 6
      type: theory
      title: Perceptual symbol systems
      text: >-
        Barsalou's PSS shows that simulation can still do the symbolic work (types, inference, recursion, propositions) using one shared
        multimodal system across memory, concepts and perception.
    - page: 7
      type: theory
      title: Social simulation and mirror circuits
      text: >-
        We understand others' actions and feelings by simulating them in our own systems; mirror neurons respond most to the goal of an
        action, so they help infer intentions.
      quote: To recognize and understand another agent’s action, primates simulate the perceived action in their own motor system.
    - page: 8
      type: experiment
      title: Seeing objects prepares actions
      text: >-
        A cup handle activates a grasp simulation (Tucker & Ellis), tuned to the object's size and orientation, even when only its name is
        read.
    - page: 9
      type: important
      title: Space is shaped by the body
      text: >-
        Space is not perceived the same in all directions; it depends on the body and what it can do. Near space even extends with arm
        length, which matters for avatars and reach in VR.
      quote: people’s perception of near space extends further outward as their arm length increases
    - page: 10
      type: important
      title: Mental rotation recruits the motor system
      text: >-
        Imagining a rotation follows bodily constraints, and mentally rotating objects comes with motor simulations of turning them.
        Directly relevant to geometry.
      quote: mental rotation of visual objects is accompanied by motor simulations of making them turn
    - page: 12
      type: experiment
      title: Simulation in language
      text: >-
        Reading "the ranger saw the eagle in the sky" speeds naming a picture of an eagle with spread wings; action words activate the
        matching motor areas within a few hundred milliseconds.
    - page: 13
      type: experiment
      title: Gestures and physical reasoning
      text: >-
        Gestures help speakers find words and help listeners understand. In reasoning about gears and pulleys, people simulate, and doing
        the related actions improves their inferences.
      quote: Carrying out associated actions can improve inference
    - page: 14
      type: important
      title: Mathematical discovery as simulation
      text: >-
        Mathematicians' and scientists' discoveries are often described as arising from simulation, and abstract ideas such as time are
        reasoned about through space.
      quote: scientific and mathematical discoveries typically arise from simulation
    - page: 15
      type: important
      title: Joint attention and timing
      text: >-
        Mirror circuits are not enough for social activity: coordinating with someone also needs joint attention and timing. Individual
        differences in simulation track empathy.
      quote: Joint attention and timing are also central in social coordination
    - page: 16
      type: theory
      title: Simulations are causal
      text: >-
        TMS over motor areas changes language processing and manipulated bodily states change performance, so simulations are not mere
        by-products.
      quote: significant evidence exists already that they are not epiphenomenal.
    - page: 18
      type: important
      title: Abstract concepts need situations
      text: >-
        Abstract concepts draw on introspection and on background situations. An abstract idea alone is hard; in a situation it becomes
        much easier.
      quote: Processing an abstract concept by itself is difficult but becomes much easier when a background situation contextualizes it.
    - page: 7
      type: idea
      title: Visible or hidden partner hands
      text: >-
        In the shared VR space, compare dyads who see the partner's hands moving the object with dyads who only see the object move, to
        test whether mirroring helps the observer learn.
    - page: 9
      type: idea
      title: Reach and manipulability
      text: >-
        Place geometric objects within or beyond each partner's reach and test whether reachable objects are explored and understood
        differently.
    - page: 15
      type: idea
      title: Measure joint attention
      text: >-
        Use eye tracking to measure when partners look at the same part of a shape, and how well their movements are timed, as predictors
        of collaborative learning.
    - page: 18
      type: idea
      title: Situated versus bare maths tasks
      text: >-
        Present the same geometry problem either as bare shapes or inside a meaningful VR situation (building a shelter, packing a box)
        and compare understanding.
