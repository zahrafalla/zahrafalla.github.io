    A VR activity for the maximum-flow problem in graph theory: graphs become pipe networks carrying water from a lake to a town, and
    learners set the flow with two hands. With 89 students, solving problems in VR (embodied concreteness) or on a tablet (manipulated
    concreteness) both raised attention, confidence and satisfaction over paper, but only VR raised perceived relevance and grounding,
    and only the tablet hurt performance on abstract problems.
  experiments:
    - id: graph-usability
      title: Pipes in VR or on a tablet
      page: 5
      own: true
      n: 26
      who: adults in Zurich and Budapest, none with VR experience
      design: between subjects, solving max-flow problems before a short video (problem solving, then instruction)
      conditions: [Tablet, VR]
      manipulated: [Device and degree of embodiment]
      measured: [Usability (SUS), Simulator sickness (SSQ), Time]
      tags: [self, rt]
      tools: [VR hand tracking, Tablet, System Usability Scale, Simulator Sickness Questionnaire, Ford–Fulkerson video]
      result: No difference in usability (VR 81, tablet 87) or sickness; VR took longer because people moved more.
      vr:
        title: Hands, controllers or a tablet
        principles:
          - Interaction congruency
          - Movement for thinking
        scene: The pipe network from the paper, at table height.
        task: Solve max-flow problems by opening and closing pipes, then watch the short video.
        conditions:
          - name: VR hands
            does: hand tracking; turn the valves with your fingers
          - name: VR controllers
            does: point and click with controllers
          - name: Tablet
            does: the same network on a tablet
          - name: Standing or seated
            does: a second factor for the two VR versions
        measures:
          - usability (SUS) and cybersickness (SSQ)
          - time, and movement split into task movement and interface movement
          - errors and presence
        why: In the original study VR took longer because people moved more. This design separates movement that helps thinking from movement that the interface forces on people.
        watch: Hand tracking fails for some people; give everyone a short tutorial.
    - id: graph-concreteness
      title: Abstract, manipulated or embodied graphs
      page: 6
      own: true
      n: 89
      who: bachelor students in a Data Structures and Algorithms course (ETH Zurich)
      design: between subjects; problem solving in one condition, then the regular lecture
      conditions: [Graphs on paper, Graphs on a tablet, Pipes in VR]
      manipulated: [Kind of concreteness]
      measured: [Attention, Relevance, Confidence, Satisfaction, Perceived grounding, Transfer to three representations]
      tags: [self, perf, learn]
      tools: [VR hand tracking, Tablet, IMMS (ARCS), Body awareness questionnaire, Math anxiety scale (AMAS), Bayesian ANOVA]
      result: >-
        Both concrete conditions raised attention, confidence and satisfaction; only VR raised relevance and grounding; only the tablet
        lowered abstract performance.
      vr:
        title: Pipes that slowly become a graph
        principles:
          - Concreteness fading
          - Grounding
          - Transfer
        scene: A room of water pipes that changes over the session; pipes become tubes with numbers, then lines and nodes.
        task: Solve max-flow problems, then take the regular lecture and an abstract test.
        conditions:
          - name: Fading
            does: the pipes turn into a graph step by step across problems
          - name: Pipes only
            does: the scene stays concrete
          - name: Graph only
            does: an abstract graph in VR from the start
        measures:
          - abstract max-flow problems on paper
          - relevance and grounding (ARCS questionnaire)
          - attention, confidence and time
        why: Chatain found that VR raised relevance and grounding but that the concrete tablet hurt abstract performance. Concreteness fading (Fyfe and colleagues) predicts that starting concrete and moving to abstract keeps the grounding without the cost to transfer.
        watch: The pace of fading matters; run a pilot to set it.
  marks:
    - page: 1
      para: 4
      type: important
      title: "Embodied concreteness: relevant, and no cost to transfer"
      text: >-
        Both tablet and VR raised attention, confidence and satisfaction; only embodied concreteness in VR raised perceived relevance
        and grounding, and unlike the tablet it did not hurt learning or transfer.
      quote: >-
        only embodied concreteness increases perceived relevance and grounding. Moreover, unlike manipulated concreteness, embodied concreteness
        does not impair learning outcomes nor transfer abilities.
    - page: 2
      para: 2
      type: gap
      title: A verbal dispute about 'concrete'
      text: >-
        In just two papers, 'concrete' meant meaningful, familiar, physical, grounded, pictorial, enactive, real-life or informal, and
        'abstract' general, symbolic or vague. The field does not agree on its key word.
      quote: There is a verbal dispute in the field of concreteness for mathematics education.
    - page: 2
      para: 4
      type: concept
      title: Grounding
      text: >-
        Mapping new ideas and symbols to experiences in a particular modality that are personally meaningful (Nathan 2021).
      quote: >-
        the process of mapping “novel ideas and symbols to modality-specific experiences that are personally meaningful”
    - page: 2
      para: 5
      type: concept
      title: Three kinds of concrete
      text: >-
        Concrete as sensed (it can be touched or seen), as specific (versus general), and as relatable (Dewey). They do not always align:
        2x − 4 = 0 cannot be touched, yet it is concrete to a mathematician.
      quote: This distinction is important as not all concretenesses align.
    - page: 2
      para: 6
      type: people
      title: Papert's gears and Wilensky's concretion
      text: >-
        Papert's gears were a 'comfortable friend' that helped him grasp equations. For Wilensky, learning is concretion: growing connections
        with something until it becomes relatable.
      quote: >-
        From this perspective, learning is a process of concretion, where one grows connections with an abstract element until it is relatable,
        and in that sense, concrete
    - page: 3
      para: 5
      type: theory
      title: Thinking as truncated action
      text: >-
        Learners' bodies take part in learning; thinking is a truncated action whose sensorimotor processes run without showing outside
        (Abrahamson & Lindgren), and cognition is situated.
      quote: >-
        thinking is described as a form of truncated action, where the sensorimotor processes related to the action are engaged, but not
        tangibly expressed externally
    - page: 3
      para: 6
      type: framework
      title: Degrees of embodiment
      text: >-
        Embodiment comes in degrees, built from sensorimotor engagement, gestural congruency and immersion (Johnson-Glenberg). 'Embodied
        concreteness' is concreteness with a high degree of embodiment in a situated, relatable context.
      quote: >-
        we define “embodied concreteness” as a form of concreteness that involves a high degree of embodiment, in a situated and relatable
        context.
    - page: 4
      para: 2
      type: concept
      title: The WATER-FLOW schema
      text: >-
        Electricity is understood through two embodied schemata, flowing water and moving crowds (Gentner & Gentner 1983). They chose
        water: a graph becomes pipes between water towers, from a lake (source) to a town (sink).
      quote: >-
        a graph is represented as a pipe network (edges) between water towers (vertices), and a simple simulation of the water flow through
        the pipes is displayed in real time.
    - page: 4
      para: 5
      type: important
      title: Two hands measure the flow
      text: >-
        One hand holds the bottom of the pipe, the other sets the water level: the capacity equals the distance between the hands. They
        got there by testing with six users, starting from a one-handed version.
      quote: >-
        it strengthens the embodiment as the capacity of the edge is directly congruent to the distance between the two hands, and it
        improves usability as the learner can release the lower hand to precisely set the level of the edge.
    - page: 4
      para: 6
      type: idea
      title: Two learners, two hands
      text: >-
        For collaborative maths in VR: one learner holds the pipe, the other sets the level, so one quantity needs both bodies to be set.
    - page: 5
      para: 1
      type: theory
      title: Problem solving before instruction
      text: >-
        PS-I (productive failure, Kapur): solving problems before being taught activates prior knowledge, shows the gap in one's knowledge,
        and draws attention to deep features.
      quote: >-
        This pattern was proven effective for mathematics learning and relies on three mechanisms: activation of prior knowledge, awareness
        of knowledge gap, and recognition of deep features
    - page: 5
      para: 5
      type: experiment
      title: VR is as usable as a tablet
      text: >-
        26 adults new to VR: usability 81 in VR and 87 on the tablet, not significantly different; minimal simulator sickness; VR took
        longer because people moved more.
    - page: 6
      para: 1
      type: important
      title: A winning pose and your own skin
      text: >-
        After testing they added a skin-colour panel for diverse bodies, a tutorial, a graph overview on the blackboard, and a 'winning
        position' (both arms up) to start the next level, for a sense of embodied achievement.
      quote: >-
        we designed for a sense of embodied achievement at the end of each level by having the users adopt a “winning position”, that
        is raising both arms in the air, to launch the next level
    - page: 6
      para: 4
      type: experiment
      title: Three kinds of concreteness, 89 students
      text: >-
        Abstract (graphs on paper), manipulated (graphs on a tablet) and embodied (pipes in VR), each used for problem solving before
        the regular lecture, then tested on three representations.
    - page: 7
      para: 3
      type: idea
      title: Measure ARCS in my study
      text: >-
        Use the IMMS (attention, relevance, confidence, satisfaction) in my VR maths study: here engagement and relevance came apart,
        which a single 'motivation' score would hide.
    - page: 8
      para: 1
      type: experiment
      title: Only VR made it relevant
      text: >-
        Attention, confidence and satisfaction rose in both concrete conditions; perceived relevance and grounding after the lecture rose
        only in VR.
      quote: >-
        both forms of concreteness significantly improved Attention, Confidence, and Satisfaction for the learners. However, only embodied
        concreteness improved perceived Relevance.
    - page: 8
      para: 5
      type: experiment
      title: The tablet hurt abstract transfer, VR did not
      text: >-
        No differences on the concrete tests (Bayes factors favour no effect); on the abstract test the paper group beat the tablet group,
        while VR was not worse than paper.
    - page: 10
      para: 1
      type: theory
      title: Mechanisms of learning with concreteness
      text: >-
        Feedback (error identification, error understanding, strategy acquisition) plus the three routes of embodiment from Körner et
        al.: direct state induction, modal priming and sensorimotor simulation.
    - page: 10
      para: 3
      type: theory
      title: Modal priming explains relevance
      text: >-
        They attribute the relevance gain of VR to modal priming: the water schema reconnects the content to learners' own experience.
      quote: >-
        only embodied concreteness increases perceived relevance and grounding. We believe that this is explained by the modal priming
        mechanism as it reconnects the content to the learners’ personal experiences
    - page: 10
      para: 4
      type: important
      title: Easy feedback, false confidence
      text: >-
        On the tablet the representation felt familiar, students felt confident and leaned on feedback, and made more errors on abstract
        problems: they lacked error understanding.
      quote: >-
        as the representation was familiar to the students, they felt confident about solving the problems, and therefore, we believe,
        were more prone to errors.
    - page: 10
      para: 5
      type: gap
      title: A taxonomy of concreteness is needed
      text: They call for a taxonomy of the kinds of concreteness, which their 2025 paper later builds.
      quote: we believe that a taxonomy of concretenesses should be defined
    - page: 10
      para: 6
      type: gap
      title: Isolate modal priming
      text: >-
        Compare a relatable but disembodied version with a relatable and embodied one, to see what embodiment adds on its own.
      quote: >-
        comparing relatable but disembodied opposed to relatable and embodied would help isolate the effect of the modal priming mechanism
        in embodiment.
    - page: 11
      para: 2
      type: idea
      title: Separate representation from medium
      text: >-
        Their conditions changed technology and representation at once. In my study, cross representation (situated or not) with medium
        (VR or not), for example with a 'pipes on a tablet' condition.
    - page: 11
      para: 3
      type: gap
      title: Assess with the body, and over time
      text: >-
        Learners show understanding in gesture before speech, yet tests were short-term, timed, in English and on paper only.
      quote: >-
        learners are usually able to express understanding through gestures before they can articulate it with speech
    - page: 11
      para: 4
      type: gap
      title: Who was left out
      text: Few women, only mathematics students, and only able-bodied participants.
      quote: our sample only included able-bodied participants
    - page: 11
      para: 5
      type: idea
      title: Fade concreteness inside VR
      text: >-
        Fade within the VR world itself: pipes, then nodes and edges, then symbols, and test when to fade. They suggest the same, with
        tools for embodied maths input.
    # ---- famous people named in the paper (2026-11-24) ----
    - page: 2
      para: 6
      type: people
      title: "Jennifer Kaminski: the cost of concreteness"
      text: Her Science paper (2008) found that concrete, relatable examples hurt transfer. Chatain asks whether an embodied kind of concreteness can ground graph theory without this cost.
    - page: 2
      para: 4
      type: people
      title: "John Dewey: what 'concrete' means"
      text: Philosopher and educator (1859–1952). Dewey called concrete what is 'readily apprehended by itself', and abstract what needs connections to familiar things. Chatain uses this learner-centred meaning of concreteness.
    - page: 4
      para: 2
      type: people
      title: "Lakoff and Johnson: embodied schemata"
      text: "Metaphors We Live By (1980): we understand abstract ideas through bodily metaphors and recurrent patterns of bodily experience (image schemata). Chatain designed the VR pipe representation from these embodied schemata."
  uses:
    - paper: cel-math-vr
      section: intro
      page: 1
      type: important
      passage: >-
        Studies in math education indicate that many students hold unproductive beliefs about mathematics: they believe mathematics has
        nothing to do with the real world, and that one must learn solutions to math problems by heart
      suggest: >-
        Many students believe mathematics has nothing to do with the real world (Chatain et al., 2023). Embodied VR can let them meet
        mathematical structures as experiences before they meet them as symbols.
    - paper: cel-math-vr
      section: related
      page: 3
