      original: اول باید یه چیزی طراحی کنی که بتونه ساده فکراشون در مورد مسعله ریضای رو بتونن اجرا کنن بعد پیچیده تر بشه ، مثل اسکچ ، یعنی
        بتونن محاسبات رو با بدن حل کنن
    - page: 20
      para: 5
      type: idea
      from: note
      title: Learning by watching a partner, without words
      text: "For the collaborative part: does watching another person's movements with objects in VR, without talking, change learning?"
      original: اگه برای قسمت کولبروتیوش ، بیایم مقایسه کنیم افرادی که حرکات بقیه رو با ابجکت ها و محیط توی وی ار مشاهده میکنن بدون حرف
