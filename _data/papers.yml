  cites: [barsalou-2008]
  summary: >-
    A theory paper that brings order to the many embodiment effects. The body can affect the mind through three routes: direct state
    induction (it changes how we feel or process), modal priming (it makes related concepts more accessible) and sensorimotor
    simulation (it makes congruent actions easier). Effects usually mix routes, and the paper gives tests to tell them apart.
  experiments:
    - id: pen
      title: The pen study
      page: 4
      own: false
      by: Strack et al. 1988
      n: ~
      who: participants
      design: smiling facilitated, inhibited or neither, without knowing it
      conditions: [Pen in teeth, Pen in lips, Neutral]
      manipulated: [Facial muscle state]
      measured: [Funniness of cartoons]
      tags: [self]
      tools: [Pen held in the mouth, Cartoons]
      result: Facilitated smiling made cartoons funnier and inhibited smiling made them less funny.
      vr:
        title: The face you see in the mirror
        principles:
          - Facial feedback
          - Self-perception
        scene: A virtual room with a mirror and a face-tracked avatar. Cartoons appear on the wall.
        task: Rate how funny each cartoon is while you can see your avatar in the mirror.
        conditions:
          - name: Smiling mirror
            does: the avatar copies the face but quietly adds a slight smile
          - name: Frowning mirror
            does: it quietly adds a slight frown
          - name: True mirror
            does: it copies the face exactly
        measures:
          - funniness ratings
          - the real face (smile intensity from face tracking)
          - mood before and after; whether people noticed the change
        why: The pen study changes the felt face. VR can separate the felt face (muscles) from the seen face (the avatar), and so asks which one feeds the judgement.
        watch: The original pen effect did not replicate in a large registered replication (Wagenmakers et al., 2016), so preregister and plan for a small effect; the headset hides the upper face from tracking.
    - id: white-coat
      title: The white coat
      page: 4
      own: false
      by: Adam & Galinsky 2012
      n: ~
      who: participants
      design: wearing the same coat under two different names
      conditions: [Doctor's coat, Painter's coat]
      manipulated: [Meaning of the coat]
      measured: [Attention-task performance]
      tags: [perf]
      tools: [White coat, A label for it]
      result: Attention improved only when the coat was introduced as a doctor's coat.
      vr:
        title: The coat on your avatar
        principles:
          - Enclothed cognition
          - Proteus effect
          - Identity
        scene: A changing room with a mirror. The participant's avatar wears a white coat.
        task: An attention task (spot the differences), then hard maths puzzles where you can stop whenever you want.
        conditions:
          - name: Mathematician's coat
            does: the coat is introduced as a mathematician's lab coat
          - name: Painter's coat
            does: the same coat, introduced as a painter's coat
          - name: Own clothes
            does: an avatar in everyday clothes
        measures:
          - attention errors
          - persistence (time before giving up on the hard puzzles)
          - maths self-efficacy
        why: Enclothed cognition and the Proteus effect both say that the body you wear and see changes how you act. The question for learning is whether a "mathematician" avatar makes people persist longer at maths.
        watch: Enclothed-cognition replications are mixed, so preregister; offer avatars that match each participant and avoid stereotypes.

  marks:
    - page: 1
      type: gap
      title: Many demonstrations, few explanations
      text: >-
        Embodiment research is full of striking effects but lacks an account of how bodily states change behaviour. My studies should
        test mechanisms, not only show that the body matters.
      quote: Research on embodiment is rich in impressive demonstrations but somewhat poor in comprehensive explanations.
    - page: 1
      type: concept
      title: A working definition of embodiment
      text: >-
        Embodiment is defined by its effect, without committing to how knowledge is represented: the body, its state, its shape or its
        mental image plays an instrumental role in processing information.
      quote: an effect where the body, its sensorimotor state, its morphology, or its mental representation play an instrumental role in information processing
    - page: 2
      type: framework
      title: Route 1, direct state induction
      text: >-
        Some bodily states directly change feelings or the style of processing (for example approach or avoidance), without any
        inference. The effect is broad, stable and similar across cultures.
      quote: Some bodily states directly induce affective or non-affective feelings and are not mediated by any kind of higher cognitive mechanism such as attributions or inferences
    - page: 2
      type: framework
      title: Route 2, modal priming
      text: >-
        A bodily state activates associated concepts, often through metaphors ("something smells fishy"). The effect is specific,
        short-lived, learned and shaped by language and culture.
      quote: In modal priming, sensorimotor states activate (often abstract) concepts.
    - page: 3
      type: framework
      title: Route 3, sensorimotor simulation
      text: >-
        Perceiving something automatically triggers a simulation of acting on it, so congruent actions get easier and incongruent ones
        harder. Simulation depends on prior experience and skill.
      quote: Perceiving a stimulus automatically triggers the simulation of reenacting or interacting with it
    - page: 3
      type: important
      title: Simulation in social interaction
      text: >-
        We understand others' actions with the same brain regions we use to perform them, and young children learn others' goals by
        handling objects themselves. A mechanism for learning from a partner.
      quote: Understanding actions in others involves activity in brain regions involved in performing these very actions.
    - page: 4
      type: theory
      title: Mixed routes and conscious inferences
      text: >-
        Most effects run through several routes at once, and conscious interpretation can add to or even reverse them. What a movement is
        taken to mean matters.
      quote: joint influences are rather the rule than the exception.
    - page: 4
      type: experiment
      title: The white coat and the pen
      text: >-
        A white coat improved attention only when it was called a doctor's coat. In the classic pen study, holding a pen to facilitate or
        inhibit smiling changed how funny cartoons seemed, best explained by sensorimotor simulation.
    - page: 5
      type: important
      title: How to tell the routes apart
      text: >-
        Measure the induced state (direct induction), measure concept accessibility (priming), or block the simulation with a concurrent
        task that uses the same body parts (simulation).
      quote: a concurrent task that engages the same sensorimotor resources as the simulation should interfere with the simulation.
    - page: 6
      type: experiment
      title: The strongest test of simulation
      text: >-
        Facilitation alone could also be priming; only inhibition is specific to simulation. A design with facilitation, inhibition and a
        neutral condition is the strongest test.
      quote: Having all three conditions in the same experiment (i.e., facilitation, inhibition, and a neutral condition, where simulation is neither facilitated nor inhibited) constitutes a strong test for simulation.
    - page: 2
      type: idea
      title: Rule out mood and arousal
      text: >-
        Measure affect and physiological arousal (HRV, as in my MSc) in VR studies, so that an embodiment effect on learning can be
        separated from a general change in state.
    - page: 4
      type: idea
      title: The label of a gesture
      text: >-
        Give the same hand movement two different names ("this is a rotation" or no name) and test whether the framing changes what
        learners understand from it.
    - page: 6
      type: idea
      title: Three-condition VR maths study
      text: >-
        Compare a congruent hand movement (facilitation), hands kept busy with an incongruent task (inhibition) and a neutral condition,
        to test whether gesturing helps geometry through simulation.
    # ---- from my Zotero: my notes and highlights ----
    - page: 2
      type: idea
      from: note
      title: Modal priming is learned
      text: "My note: the paper is about three ways the body affects the mind (direct induction, modal priming, simulation) and how to tell
        them apart. I'm not sure how useful it is for me, but modal priming has to be learned, so it probably connects to learning."
      original: در مورد سه تا مکانیزم بود که چجوری بدن روی مغز تاثیر میذاره 1-direct induction 2-modal priming 3-simulation بعد اومده بود
        بحث کرده بود که هر کدوم چه ویژگی هایی داشتن ، چجوری تشخصی بدیم کدومه نمیدونم خلیی به درد من بخره یا نه ولی یه دونه داشت که مودال
        پرایمینگه یادگرفتنیه و باید یادبگیری ای احتمالا به لرنینگ ربط داشته باشه
    # ---- famous people named in the paper (2026-11-24) ----
    - page: 2
      para: 4
      type: people
      title: "William James: the body comes first"
      text: Father of American psychology (1842–1910). His theory of emotion says the bodily change comes first and the feeling is our perception of it. The authors compare their first route, direct state induction (such as facial feedback), to it.
    - page: 2
      para: 4
      type: people
      title: "Robert Zajonc: the face shapes the feeling"
      text: Social psychologist (1923–2008), known for the mere-exposure effect and, with Markus, for theories of how facial movements change emotion. Cited with James as background to direct state induction.
    - page: 1
      para: 5
      type: people
      title: "Norbert Schwarz: feelings as information"
      text: Social psychologist whose feelings-as-information theory says we use our feelings as evidence when we judge, unless we blame them on something else. The authors use him for when a bodily feeling stops working (misattribution) and for the 'fishy smell and distrust' study.
    - page: 2
      para: 3
      type: people
      title: "Paula Niedenthal: embodied emotion"
      text: Psychologist who showed that understanding an emotion means partly re-living it in the body and face. Cited for direct state induction and for simulation in emotion.
    - page: 3
      para: 2
      type: people
      title: "John Bargh: automatic behaviour"
      text: Social psychologist known for automaticity and priming; his 1996 study reported that reading words about old age made people walk slower, a result that later failed to replicate. The authors cite it for two-way links between bodily states and concepts.
    - page: 4
      para: 4
      type: people
      title: "Adam Galinsky: enclothed cognition"
      text: "Social psychologist; with Hajo Adam (2012) he found that a white coat improved attention only when it was called a doctor's coat. The paper uses it as a mixed effect: both the label and the wearing are needed."

  uses:
    - paper: embodied-learning
      section: intro
      page: 1
      type: important
      passage: Research on embodiment is rich in impressive demonstrations but somewhat poor in comprehensive explanations.
      suggest: >-
        Embodiment research has produced many striking demonstrations but few explanations of how the body shapes the mind (Körner et
        al., 2015). This paper therefore asks not only whether bodily practice helps learning, but through which route.
    - paper: embodied-learning
      section: background
      page: 1
      type: theory
      passage: >-
        direct state induction, which influences how humans feel or process information, unmediated by any other cognitive mechanism;
        modal priming, which changes the accessibility of concepts associated with a bodily state; sensorimotor simulation, which affects
        the ease with which congruent and incongruent actions are performed.
      suggest: >-
        Körner et al. (2015) distinguish three routes from body to mind: direct state induction, modal priming and sensorimotor
        simulation. We use this distinction to state which route each of our manipulations is meant to engage.
    - paper: embodied-learning
      section: method
      page: 6
      type: experiment
      passage: >-
        Having all three conditions in the same experiment (i.e., facilitation, inhibition, and a neutral condition, where simulation is
        neither facilitated nor inhibited) constitutes a strong test for simulation.
      suggest: >-
        To test whether bodily practice works through simulation, the design includes facilitation, inhibition and neutral conditions,
        which Körner et al. (2015) describe as the strongest test of simulation.
    - paper: embodied-learning
      section: results
      page: 5
      type: important
      passage: >-
        If, however, the proposed state does vary with the manipulation, and if this variation mediates the effect of the manipulation on
        the dependent measure, then direct state induction seems responsible for producing the embodiment effect at hand.
      suggest: >-
        H3: If bodily practice works only through a change in state, affect or arousal should mediate its effect on learning. We measure
        both so that this route can be ruled in or out (Körner et al., 2015).
    - paper: cel-math-vr
      section: related
      page: 3
      type: important
      passage: Understanding actions in others involves activity in brain regions involved in performing these very actions.
      suggest: >-
        Partners in a shared VR space may understand each other's manipulations by simulating them, since understanding others' actions
        engages the brain regions used to perform them (Körner et al., 2015).
    - paper: cel-math-vr
      section: limits
      page: 4
      type: theory
      passage: joint influences are rather the rule than the exception.
      suggest: >-
        In a rich, shared VR setting, effects probably arise through several routes at once (Körner et al., 2015); future studies should
        isolate them one by one.

