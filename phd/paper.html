<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper analysis</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#ffffff; --ink:#15181d; --muted:#5c6673; --line:#e5e9ef;
    --accent:#0e9f8e; --accent-ink:#0b7d70; --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
    --c-collaborative:#0e9f8e; --c-embodied:#e8743b; --c-learning:#3e6fd6; --c-mathematics:#8a5cf0; --c-vr:#d64d8a; --c-method:#7a8699;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121519; --panel:#1a1e25; --ink:#e8ebef; --muted:#9aa4b2; --line:#2a303a; --accent:#2fd2be; --accent-ink:#2fd2be;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);
    line-height:1.55; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1000px; margin:0 auto; padding:22px 16px 72px;}
  .topline{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .topline a.back{color:var(--accent-ink); text-decoration:none; font-weight:650; font-size:14px;}
  .topline a.back:hover{text-decoration:underline;}
  .pos{color:var(--muted); font-size:13px; margin-left:auto;}
  .pn{display:inline-flex; align-items:center; gap:4px; padding:7px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); text-decoration:none; font-size:13px; font-weight:650;}
  .pn:hover{border-color:color-mix(in srgb,var(--ink) 25%,transparent);}
  .pn[aria-disabled="true"]{opacity:.4; pointer-events:none;}

  .hero{display:flex; gap:20px; align-items:center; margin-top:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:20px; box-shadow:var(--shadow);}
  .tile{width:132px; height:132px; flex:none; border-radius:16px; padding:6px;
    background:radial-gradient(130% 130% at 50% 46%, #141d3a 0%, #0a1024 55%, #05070f 100%); border:1px solid #121a33;}
  .tile svg{width:100%; height:100%; display:block;}
  .eyebrow{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); font-weight:800;}
  h1{font-size:clamp(20px,3vw,27px); margin:.2em 0 .25em; letter-spacing:-.02em; line-height:1.25;}
  .authors{color:var(--muted); font-size:14px; margin-bottom:8px;}
  .pills{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
  .pill{font-size:12px; font-weight:650; padding:3px 10px; border-radius:999px; background:color-mix(in srgb,var(--ink) 7%,transparent); color:var(--muted);}
  .pill.full{background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent-ink);}
  .tchip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:650; padding:4px 10px; border-radius:999px;
    color:var(--c); background:color-mix(in srgb,var(--c) 15%,transparent); margin:2px 4px 2px 0;}
  .tchip i{width:8px; height:8px; border-radius:50%; background:var(--c);}
  .actions{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;}
  .btn{display:inline-flex; gap:6px; align-items:center; padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700;
    text-decoration:none; border:1px solid var(--line); color:var(--ink); background:var(--panel);}
  .btn.dark{background:#0b1024; color:#ffd27a; border-color:#1b2547;}
  .btn:hover{filter:brightness(1.05); border-color:color-mix(in srgb,var(--ink) 25%,transparent);}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-top:16px;}
  .card h2{font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:800; margin:0 0 12px;}
  .card .sub{color:var(--muted); font-size:13.5px; margin:-4px 0 12px;}
  .conn{display:block; padding:11px 12px; border-radius:11px; text-decoration:none; color:var(--ink); border:1px solid transparent; margin-bottom:4px;}
  .conn:hover{background:color-mix(in srgb,var(--ink) 4%,transparent); border-color:var(--line);}
  .conn .ct{display:flex; justify-content:space-between; gap:10px; font-weight:650; font-size:14px;}
  .conn .ct span{color:var(--accent-ink); font-size:12.5px; font-variant-numeric:tabular-nums; flex:none;}
  .words{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .w{font-size:11.5px; padding:2px 8px; border-radius:999px; background:color-mix(in srgb,var(--ink) 7%,transparent); color:var(--muted);}
  .idea{display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line);}
  .idea:first-of-type{border-top:none;}
  .idea .star{color:#e6a93a; font-size:17px; text-shadow:0 0 10px rgba(255,200,100,.6);}
  .idea b{font-size:14px;} .idea p{margin:2px 0 0; font-size:13px; color:var(--muted);}
  .missing{text-align:center; padding:60px 20px; color:var(--muted);}
  .missing a{color:var(--accent-ink);}
  @media (max-width:600px){ .hero{flex-direction:column; align-items:flex-start;} .tile{width:110px; height:110px;} .pos{width:100%; margin-left:0;} }
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="wrap">
  <div class="topline">
    <a class="back" href="library.html">← Library</a>
    <span class="pos" id="pos"></span>
    <a class="pn" id="prev" href="#">‹ Previous</a>
    <a class="pn" id="next" href="#">Next ›</a>
  </div>
  <div id="page"></div>
</div>

<script src="lexicon.js"></script>
<script src="papers.js"></script>
<script src="analysis-view.js"></script>
<script>
(function(){
  "use strict";
  const LEX = window.LEX, ALL = Array.isArray(window.PAPERS) ? window.PAPERS : [];
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
  const p = ALL[id];

  if(!p){
    $("#page").innerHTML = `<div class="missing"><h2>Paper not found</h2><p>Pick a paper from the <a href="library.html">Library</a>.</p></div>`;
    $("#prev").setAttribute("aria-disabled","true"); $("#next").setAttribute("aria-disabled","true"); return;
  }
  document.title = p.title + " — analysis";

  /* prev / next */
  $("#pos").textContent = `Paper ${id+1} of ${ALL.length}`;
  const setNav = (el, j) => { if(j<0 || j>=ALL.length) el.setAttribute("aria-disabled","true"); else el.href = `paper.html?id=${j}`; };
  setNav($("#prev"), id-1); setNav($("#next"), id+1);
  document.addEventListener("keydown", e => { if(e.target.tagName==="INPUT") return;
    if(e.key==="ArrowLeft" && id>0) location.href=`paper.html?id=${id-1}`;
    if(e.key==="ArrowRight" && id<ALL.length-1) location.href=`paper.html?id=${id+1}`; });

  /* connections (same similarity as the constellation) */
  const vec = q => { const v={}; let n=0; Object.entries(q.dna||{}).forEach(([k,c])=>{ v[k]=Math.sqrt(c); n+=c; }); return {v, norm:Math.sqrt(n)||1}; };
  const me = vec(p);
  const links = ALL.map((q,j) => { if(j===id) return null; const o=vec(q); let dot=0; const sh=[];
      for(const k in me.v) if(o.v[k]){ dot+=me.v[k]*o.v[k]; sh.push([k, Math.min(p.dna[k], q.dna[k])]); }
      return dot ? { j, q, sim:dot/(me.norm*o.norm), shared:sh.sort((a,b)=>b[1]-a[1]).map(s=>s[0]) } : null; })
    .filter(Boolean).sort((a,b)=>b.sim-a.sim).slice(0,6);

  /* shared ideas: this paper's concepts that other papers also support */
  const ideas = Object.keys(p.dna||{}).map(k => ({ k, n: ALL.filter(q=>q.dna && q.dna[k]).length, spark: LEX.sparkFor(k) }))
    .filter(x => x.n >= 2).sort((a,b)=> (b.spark?1:0)-(a.spark?1:0) || b.n-a.n).slice(0,6);

  const vm = AnalysisView.fromPaper(p);
  const themes = LEX.THEMES.filter(t => p.keywords && p.keywords[t.key]);
  $("#page").innerHTML = `
    <div class="hero">
      <div class="tile">${AnalysisView.miniBurst(p.dna||{})}</div>
      <div style="flex:1; min-width:0">
        <div class="eyebrow">Paper analysis${p.year?` · ${esc(p.year)}`:""}</div>
        <h1>${esc(p.title)}</h1>
        ${p.authors?`<div class="authors">${esc(p.authors)}</div>`:""}
        <div class="pills">
          ${vm.pages?`<span class="pill">${vm.pages} page${vm.pages==1?"":"s"}</span>`:""}
          ${vm.words?`<span class="pill">${Number(vm.words).toLocaleString()} words</span>`:""}
          <span class="pill">${themes.length}/5 themes</span>
          <span class="pill">${Object.keys(p.dna||{}).length} concepts</span>
          <span class="pill ${vm.partial?"":"full"}">${vm.partial?"Basic reading":"Full analysis"}</span>
        </div>
        <div>${themes.map(t=>`<span class="tchip" style="--c:${t.color}"><i></i>${esc(t.label)}</span>`).join("")}</div>
        <div class="actions">
          <a class="btn dark" href="constellation.html?paper=${id}">✦ See it in the constellation</a>
        </div>
      </div>
    </div>
    <div id="view"></div>
    <div class="card">
      <h2>Connected papers — and the words they share</h2>
      <p class="sub">The papers whose concept fingerprints overlap most with this one.</p>
      ${links.length ? links.map(l=>`<a class="conn" href="paper.html?id=${l.j}">
          <div class="ct">${esc(l.q.title)}<span>${Math.round(l.sim*100)}% in common</span></div>
          <div class="words">${l.shared.slice(0,7).map(w=>`<span class="w">${esc(LEX.label(w))}</span>`).join("")}</div></a>`).join("")
        : `<p class="sub">No overlapping concepts with other papers yet.</p>`}
    </div>
    ${ideas.length ? `<div class="card">
      <h2>✦ Ideas this paper helps support</h2>
      <p class="sub">Concepts here that other papers in the review also discuss — the stronger the support, the safer the ground.</p>
      ${ideas.map(x=>`<div class="idea"><span class="star">✦</span><div><b>${esc(LEX.label(x.k))}</b>
        <span class="w" style="margin-left:6px">${x.n} papers</span>${x.spark?`<p>${esc(x.spark.s)}</p>`:""}</div></div>`).join("")}
    </div>` : ""}`;

  AnalysisView.render($("#view"), vm);
})();
</script>
</body>
</html>
